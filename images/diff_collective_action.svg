<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="Arial, sans-serif">
  <rect width="680" height="410" fill="#f8fafc" rx="14" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Collective Action — Three Cases</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#64748b">Each person joins only if current participants ≥ their personal threshold</text>

  <!-- ══ CASE 1: No Action — Threshold Too High ══ -->
  <rect x="14"  y="60" width="198" height="320" rx="10" fill="white" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="14"  y="60" width="198" height="30"  rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="113" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Case 1: No Action</text>
  <text x="113" y="100" text-anchor="middle" font-size="10" fill="#64748b">Threshold too high</text>

  <!-- People with thresholds shown as person icons + threshold label -->
  <!-- Thresholds: 1,2,4,6,8,9,10,10 (gap at 3,5,7) -->
  <g font-size="10" text-anchor="middle">
    <!-- Person 1: threshold 1 → joins (green) -->
    <circle cx="68"  cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="68"  y="130" fill="white" font-weight="bold">1</text>
    <text x="68"  y="148" fill="#15803d">T=1 ✓</text>

    <!-- Person 2: threshold 2 → joins (green) -->
    <circle cx="113" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="113" y="130" fill="white" font-weight="bold">2</text>
    <text x="113" y="148" fill="#15803d">T=2 ✓</text>

    <!-- Person 3: threshold 4 → STUCK (gap at 3) (red) -->
    <circle cx="158" cy="126" r="12" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="158" y="130" fill="white" font-weight="bold">3</text>
    <text x="158" y="148" fill="#991b1b">T=4 ✗</text>

    <text x="113" y="172" fill="#64748b">↑ Only 2 join.</text>
    <text x="113" y="186" fill="#64748b">Gap at count=3</text>
    <text x="113" y="200" fill="#64748b">means Person 3</text>
    <text x="113" y="214" fill="#64748b">never joins.</text>

    <!-- Cascade shows: 1→2→stuck -->
    <rect x="30" y="225" width="156" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="108" y="243" text-anchor="middle" fill="#991b1b" font-weight="bold">Chain breaks!</text>
    <text x="108" y="260" text-anchor="middle" fill="#991b1b">Count: 1 → 2 → ✗ stuck</text>
    <text x="108" y="276" text-anchor="middle" fill="#991b1b">Nobody else joins</text>

    <rect x="30" y="296" width="156" height="72" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="108" y="314" text-anchor="middle" fill="#7f1d1d" font-weight="bold">Why it fails:</text>
    <text x="108" y="330" text-anchor="middle" fill="#7f1d1d">The sorted thresholds</text>
    <text x="108" y="346" text-anchor="middle" fill="#7f1d1d">have a jump &gt; 1</text>
    <text x="108" y="360" text-anchor="middle" fill="#7f1d1d">→ cascade can't bridge</text>
  </g>

  <!-- ══ CASE 2: No Action — Information Failure ══ -->
  <rect x="242" y="60" width="196" height="320" rx="10" fill="white" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="242" y="60" width="196" height="30"  rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">Case 2: No Action</text>
  <text x="340" y="100" text-anchor="middle" font-size="10" fill="#64748b">Feasible, but info missing</text>

  <g font-size="10" text-anchor="middle">
    <!-- 5 people, thresholds 1,2,3,4,5 — feasible! But limited info -->
    <circle cx="282" cy="126" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="282" y="130" fill="white" font-weight="bold">A</text>
    <text x="282" y="148" fill="#1d4ed8">T=1</text>

    <circle cx="315" cy="126" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="315" y="130" fill="white" font-weight="bold">B</text>
    <text x="315" y="148" fill="#1d4ed8">T=2</text>

    <circle cx="348" cy="126" r="12" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="348" y="130" fill="white" font-weight="bold">C</text>
    <text x="348" y="148" fill="#64748b">T=3 ?</text>

    <circle cx="381" cy="126" r="12" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="381" y="130" fill="white" font-weight="bold">D</text>
    <text x="381" y="148" fill="#64748b">T=4 ?</text>

    <circle cx="414" cy="126" r="12" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="414" y="130" fill="white" font-weight="bold">E</text>
    <text x="414" y="148" fill="#64748b">T=5 ?</text>

    <text x="340" y="172" fill="#64748b">A and B know only</text>
    <text x="340" y="186" fill="#64748b">their own threshold,</text>
    <text x="340" y="200" fill="#64748b">not C, D, E's.</text>
    <text x="340" y="214" fill="#64748b">C waits to see D,E join first.</text>
    <text x="340" y="228" fill="#64748b">D,E wait too → nobody acts.</text>

    <rect x="258" y="240" width="164" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="340" y="258" text-anchor="middle" fill="#9a3412" font-weight="bold">Coordination failure!</text>
    <text x="340" y="275" text-anchor="middle" fill="#9a3412">Coalition {A,B,C,D,E} could</text>
    <text x="340" y="291" text-anchor="middle" fill="#9a3412">work but nobody commits</text>

    <rect x="258" y="308" width="164" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="340" y="326" text-anchor="middle" fill="#78350f" font-weight="bold">Fix: public meeting</text>
    <text x="340" y="342" text-anchor="middle" fill="#78350f">Make thresholds common</text>
    <text x="340" y="358" text-anchor="middle" fill="#78350f">knowledge → Case 3</text>
  </g>

  <!-- ══ CASE 3: Action Succeeds ══ -->
  <rect x="468" y="60" width="198" height="320" rx="10" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <rect x="468" y="60" width="198" height="30"  rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="567" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Case 3: Action!</text>
  <text x="567" y="100" text-anchor="middle" font-size="10" fill="#64748b">Mutual awareness + low thresholds</text>

  <g font-size="10" text-anchor="middle">
    <!-- Same 5 people, now thresholds are common knowledge and feasible -->
    <circle cx="506" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="506" y="130" fill="white" font-weight="bold">A</text>
    <text x="506" y="148" fill="#15803d">T=1 ✓</text>

    <circle cx="539" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="539" y="130" fill="white" font-weight="bold">B</text>
    <text x="539" y="148" fill="#15803d">T=2 ✓</text>

    <circle cx="572" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="572" y="130" fill="white" font-weight="bold">C</text>
    <text x="572" y="148" fill="#15803d">T=3 ✓</text>

    <circle cx="605" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="605" y="130" fill="white" font-weight="bold">D</text>
    <text x="605" y="148" fill="#15803d">T=4 ✓</text>

    <circle cx="638" cy="126" r="12" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="638" y="130" fill="white" font-weight="bold">E</text>
    <text x="638" y="148" fill="#15803d">T=5 ✓</text>

    <text x="567" y="172" fill="#64748b">Everyone knows each</text>
    <text x="567" y="186" fill="#64748b">other's threshold.</text>
    <text x="567" y="200" fill="#64748b">A joins → count=1 ≥ T_B=2?</text>
    <text x="567" y="214" fill="#64748b">No, wait for A+B → C joins.</text>
    <text x="567" y="228" fill="#64748b">Chain: A→B→C→D→E</text>

    <rect x="484" y="240" width="168" height="60" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1"/>
    <text x="568" y="258" text-anchor="middle" fill="#166534" font-weight="bold">Coalition forms!</text>
    <text x="568" y="275" text-anchor="middle" fill="#166534">Cascade: 1→2→3→4→5</text>
    <text x="568" y="291" text-anchor="middle" fill="#166534">All 5 participate ✓</text>

    <rect x="484" y="308" width="168" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="568" y="326" text-anchor="middle" fill="#065f46" font-weight="bold">Key enabler:</text>
    <text x="568" y="342" text-anchor="middle" fill="#065f46">Common knowledge of</text>
    <text x="568" y="358" text-anchor="middle" fill="#065f46">thresholds (public info)</text>
  </g>
</svg>
