<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#1e1b4b" rx="12"/>
  <text x="360" y="28" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="16" font-weight="bold">Network Resilience: Random Failure vs Targeted Attack</text>

  <!-- LEFT: Scale-Free Network -->
  <text x="180" y="60" text-anchor="middle" fill="#fb923c" font-family="Arial" font-size="13" font-weight="bold">Scale-Free (Power Law) Network</text>
  <!-- Hub node -->
  <circle cx="180" cy="140" r="30" fill="#dc2626" stroke="#f87171" stroke-width="3"/>
  <text x="180" y="145" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">HUB</text>
  <!-- Spoke nodes -->
  <circle cx="100" cy="100" r="10" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="120" cy="180" r="10" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="260" cy="100" r="10" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="260" cy="170" r="10" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="180" cy="200" r="10" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="100" cy="150" r="8" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
  <circle cx="260" cy="140" r="8" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
  <circle cx="140" cy="85" r="7" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
  <circle cx="220" cy="85" r="7" fill="#6366f1" stroke="#818cf8" stroke-width="1"/>
  <!-- Edges to hub -->
  <line x1="110" y1="100" x2="152" y2="128" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="128" y1="175" x2="155" y2="155" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="250" y1="105" x2="208" y2="130" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="252" y1="166" x2="210" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="180" y1="190" x2="180" y2="170" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="108" y1="148" x2="150" y2="142" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="252" y1="140" x2="210" y2="140" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="147" y1="90" x2="155" y2="118" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="215" y1="90" x2="200" y2="115" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Random Failure (left bottom) -->
  <rect x="30" y="235" width="300" height="90" fill="#064e3b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="180" y="258" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="12" font-weight="bold">✅ Random Failure</text>
  <text x="180" y="278" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="11">Removes a small node (low degree)</text>
  <text x="180" y="295" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="11">Hub survives → Network stays connected</text>
  <text x="180" y="315" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="12" font-weight="bold">ROBUST ✓</text>

  <!-- Targeted Attack (left bottom) -->
  <rect x="30" y="340" width="300" height="90" fill="#7f1d1d" stroke="#f87171" stroke-width="2" rx="8"/>
  <text x="180" y="363" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="12" font-weight="bold">❌ Targeted Attack</text>
  <text x="180" y="383" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="11">Removes the HUB (highest degree)</text>
  <text x="180" y="400" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="11">All spokes disconnected → SHATTERED</text>
  <text x="180" y="420" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="12" font-weight="bold">EXTREMELY FRAGILE ✗</text>

  <!-- Divider -->
  <line x1="360" y1="50" x2="360" y2="440" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- RIGHT: Random Network -->
  <text x="540" y="60" text-anchor="middle" fill="#818cf8" font-family="Arial" font-size="13" font-weight="bold">Random (Bell Curve) Network</text>
  <!-- Mesh of similar-sized nodes -->
  <circle cx="460" cy="110" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="500" cy="90" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="540" cy="110" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="580" cy="90" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="620" cy="110" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="460" cy="160" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="500" cy="180" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="540" cy="160" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="580" cy="180" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <circle cx="620" cy="160" r="12" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <!-- Mesh edges -->
  <line x1="472" y1="110" x2="488" y2="95" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="512" y1="90" x2="528" y2="105" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="552" y1="110" x2="568" y2="95" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="592" y1="90" x2="608" y2="105" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="460" y1="122" x2="460" y2="148" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="540" y1="122" x2="540" y2="148" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="620" y1="122" x2="620" y2="148" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="472" y1="160" x2="488" y2="175" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="512" y1="180" x2="528" y2="165" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="552" y1="160" x2="568" y2="175" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="500" y1="102" x2="500" y2="168" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="580" y1="102" x2="580" y2="168" stroke="#818cf8" stroke-width="1.2"/>
  <line x1="472" y1="105" x2="528" y2="105" stroke="#818cf8" stroke-width="1.0" stroke-dasharray="3,2"/>
  <line x1="472" y1="165" x2="528" y2="170" stroke="#818cf8" stroke-width="1.0" stroke-dasharray="3,2"/>
  <text x="540" y="205" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">All nodes have similar degree</text>

  <!-- Random Failure (right bottom) -->
  <rect x="390" y="235" width="300" height="90" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="540" y="258" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="bold">⚠️ Random Failure</text>
  <text x="540" y="278" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="11">Removes any node (all similar)</text>
  <text x="540" y="295" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="11">Small impact → many removals needed</text>
  <text x="540" y="315" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="bold">MODERATE</text>

  <!-- Targeted Attack (right bottom) -->
  <rect x="390" y="340" width="300" height="90" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="540" y="363" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="bold">⚠️ Targeted Attack</text>
  <text x="540" y="383" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="11">No critical hub to target</text>
  <text x="540" y="400" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="11">"Best" node ≈ any other node</text>
  <text x="540" y="420" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="12" font-weight="bold">ALSO MODERATE</text>
</svg>
