  <text x="350" y="130" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">DEFAULTED</text>
  
  <circle cx="200" cy="200" r="24" fill="#ffcc00" opacity="0.8" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="200" y="195" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Bank B</text>
  <text x="200" y="208" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">STRESSED</text>
  
  <circle cx="500" cy="200" r="24" fill="#ffcc00" opacity="0.8" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="500" y="195" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Bank C</text>
  <text x="500" y="208" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">STRESSED</text>
  
  <circle cx="130" cy="300" r="22" fill="#2ecc71" opacity="0.7" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="130" y="295" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Bank D</text>
  <text x="130" y="308" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="8">SOLVENT</text>
  
  <circle cx="350" cy="310" r="22" fill="#2ecc71" opacity="0.7" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="350" y="305" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Bank E</text>
  <text x="350" y="318" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="8">SOLVENT</text>
  
  <circle cx="570" cy="300" r="22" fill="#2ecc71" opacity="0.7" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="570" y="295" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Bank F</text>
  <text x="570" y="308" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="8">SOLVENT</text>
  
  <!-- Directed edges (lending) -->
  <line x1="340" y1="145" x2="210" y2="180" stroke="#e94560" stroke-width="2" opacity="0.7" marker-end="url(#arrowRed)"/>
  <line x1="360" y1="145" x2="490" y2="180" stroke="#e94560" stroke-width="2" opacity="0.7"/>
  <line x1="190" y1="222" x2="140" y2="280" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <line x1="210" y1="222" x2="340" y2="290" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <line x1="490" y1="222" x2="360" y2="290" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <line x1="510" y1="222" x2="560" y2="280" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Labels -->
  <text x="280" y="155" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10">Direct loss</text>
  <text x="430" y="155" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10">Direct loss</text>
  
  <!-- Legend box -->
  <rect x="30" y="55" width="130" height="85" fill="rgba(255,255,255,0.05)" rx="6"/>
  <circle cx="50" cy="75" r="8" fill="#e94560"/><text x="70" y="79" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="10">Defaulted</text>
  <circle cx="50" cy="100" r="8" fill="#ffcc00"/><text x="70" y="104" fill="#ffcc00" font-family="Arial,sans-serif" font-size="10">Stressed</text>
  <circle cx="50" cy="125" r="8" fill="#2ecc71"/><text x="70" y="129" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">Solvent</text>

  <!-- Key insight -->
  <rect x="80" y="355" width="540" height="35" fill="rgba(255,204,0,0.08)" rx="6"/>
  <text x="350" y="377" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="12" font-weight="bold">⚠ Counter-intuitive: More connectivity → MORE contagion risk, not less</text>
</svg>
