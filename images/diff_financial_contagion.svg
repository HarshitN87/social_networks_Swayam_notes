<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#bg4)" rx="12"/>
  <text x="350" y="32" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Financial Contagion — Banking Network as Cascade Model</text>
  
  <!-- Bank nodes -->
  <circle cx="350" cy="120" r="28" fill="#e94560" opacity="0.9" stroke="#ff6b6b" stroke-width="2"/>
