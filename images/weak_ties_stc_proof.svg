<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="380" fill="url(#bg5)" rx="12"/>
  <text x="360" y="30" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Strong Triadic Closure → Local Bridges Must Be Weak Ties</text>

  <!-- Proof by contradiction -->
  <rect x="30" y="50" width="660" height="50" fill="rgba(233,69,96,0.08)" rx="8"/>
  <text x="360" y="72" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Proof by Contradiction</text>
  <text x="360" y="90" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="11">Assume: A local bridge A↔B is a STRONG tie. Show this leads to contradiction.</text>

  <!-- Step 1 -->
  <rect x="30" y="115" width="210" height="165" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="135" y="138" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Step 1: Setup</text>
  <circle cx="95" cy="195" r="16" fill="#53d8fb" opacity="0.85"/><text x="95" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">A</text>
  <circle cx="175" cy="195" r="16" fill="#e94560" opacity="0.85"/><text x="175" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">B</text>
  <line x1="111" y1="195" x2="159" y2="195" stroke="#ffcc00" stroke-width="3" opacity="0.9"/>
  <text x="135" y="232" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="10" font-weight="bold">STRONG (assumed)</text>
  <circle cx="95" cy="250" r="10" fill="#2ecc71" opacity="0.7"/><text x="95" y="254" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">C</text>
  <line x1="95" y1="211" x2="95" y2="240" stroke="#53d8fb" stroke-width="2" opacity="0.5"/>
  <text x="135" y="270" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">A has friend C</text>

  <!-- Step 2 -->
  <rect x="255" y="115" width="210" height="165" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="360" y="138" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Step 2: Apply STC</text>
  <circle cx="320" cy="195" r="16" fill="#53d8fb" opacity="0.85"/><text x="320" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">A</text>
  <circle cx="400" cy="195" r="16" fill="#e94560" opacity="0.85"/><text x="400" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">B</text>
  <line x1="336" y1="195" x2="384" y2="195" stroke="#ffcc00" stroke-width="3" opacity="0.9"/>
  <circle cx="320" cy="250" r="10" fill="#2ecc71" opacity="0.7"/><text x="320" y="254" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">C</text>
  <line x1="320" y1="211" x2="320" y2="240" stroke="#53d8fb" stroke-width="2" opacity="0.5"/>
  <!-- STC implies B-C -->
  <line x1="330" y1="250" x2="400" y2="211" stroke="#2ecc71" stroke-width="2" stroke-dasharray="4,3" opacity="0.8"/>
  <text x="380" y="240" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">STC forces</text>
  <text x="380" y="252" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">B↔C edge!</text>

  <!-- Step 3: Contradiction -->
  <rect x="480" y="115" width="210" height="165" fill="rgba(233,69,96,0.08)" rx="8"/>
  <text x="585" y="138" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Step 3: Contradiction!</text>
  <circle cx="545" cy="195" r="16" fill="#53d8fb" opacity="0.85"/><text x="545" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">A</text>
  <circle cx="625" cy="195" r="16" fill="#e94560" opacity="0.85"/><text x="625" y="199" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">B</text>
  <line x1="561" y1="195" x2="609" y2="195" stroke="#ffcc00" stroke-width="3" opacity="0.9"/>
  <circle cx="545" cy="250" r="10" fill="#2ecc71" opacity="0.7"/><text x="545" y="254" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">C</text>
  <line x1="545" y1="211" x2="545" y2="240" stroke="#53d8fb" stroke-width="2" opacity="0.5"/>
  <line x1="555" y1="250" x2="625" y2="211" stroke="#2ecc71" stroke-width="2" opacity="0.8"/>
  <text x="585" y="270" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10" font-weight="bold">C is a common friend!</text>

  <!-- Conclusion -->
  <rect x="40" y="300" width="640" height="65" fill="rgba(255,204,0,0.06)" rx="8"/>
  <text x="360" y="322" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="13" font-weight="bold">∴ A↔B has overlap > 0 → NOT a local bridge → CONTRADICTION!</text>
  <text x="360" y="345" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12">Conclusion: If A satisfies STC, then every local bridge connected to A <tspan fill="#e94560" font-weight="bold">must be a weak tie</tspan></text>
</svg>
