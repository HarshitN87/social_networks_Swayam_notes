<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="700" height="340" fill="url(#bg4)" rx="12"/>
  <text x="350" y="28" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Why PageRank ≠ In-Degree: Quality vs Quantity</text>

  <!-- High In-Degree, Low PR -->
  <rect x="30" y="50" width="300" height="220" fill="rgba(233,69,96,0.06)" rx="10"/>
  <text x="180" y="75" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">High In-Degree, Low PageRank</text>
  <text x="180" y="93" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10">Many endorsers — but all unimportant</text>

  <circle cx="180" cy="175" r="20" fill="#e94560" opacity="0.85"/><text x="180" y="180" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12" font-weight="bold">X</text>
  <!-- Many small incoming -->
  <circle cx="80" cy="120" r="6" fill="#555"/><line x1="86" y1="123" x2="162" y2="165" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="110" cy="105" r="6" fill="#555"/><line x1="116" y1="108" x2="165" y2="160" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="140" cy="100" r="6" fill="#555"/><line x1="145" y1="104" x2="170" y2="157" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="180" cy="100" r="6" fill="#555"/><line x1="180" y1="106" x2="180" y2="155" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="220" cy="100" r="6" fill="#555"/><line x1="215" y1="104" x2="190" y2="157" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="250" cy="105" r="6" fill="#555"/><line x1="244" y1="108" x2="195" y2="160" stroke="#555" stroke-width="1" opacity="0.5"/>
  <circle cx="280" cy="120" r="6" fill="#555"/><line x1="274" y1="123" x2="198" y2="165" stroke="#555" stroke-width="1" opacity="0.5"/>
  <text x="180" y="215" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="11">In-degree = 7 but PR ≈ LOW</text>
  <text x="180" y="232" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="10">Each endorser is tiny → gives tiny fraction</text>
  <text x="180" y="260" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="22">❌</text>

  <!-- Low In-Degree, High PR -->
  <rect x="370" y="50" width="300" height="220" fill="rgba(46,204,113,0.06)" rx="10"/>
  <text x="520" y="75" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Low In-Degree, High PageRank</text>
  <text x="520" y="93" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">Few endorsers — but each is influential</text>

  <circle cx="520" cy="175" r="20" fill="#2ecc71" opacity="0.85"/><text x="520" y="180" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Y</text>
  <!-- Few large incoming -->
  <circle cx="440" cy="120" r="16" fill="#ffcc00" opacity="0.7"/><text x="440" y="124" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="9" font-weight="bold">BIG</text>
  <line x1="453" y1="132" x2="505" y2="162" stroke="#ffcc00" stroke-width="3" opacity="0.7"/>
  <circle cx="600" cy="120" r="16" fill="#ffcc00" opacity="0.7"/><text x="600" y="124" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="9" font-weight="bold">BIG</text>
  <line x1="587" y1="132" x2="535" y2="162" stroke="#ffcc00" stroke-width="3" opacity="0.7"/>
  <text x="520" y="215" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">In-degree = 2 but PR ≈ HIGH</text>
  <text x="520" y="232" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="10">Each endorser is huge → gives large fraction</text>
  <text x="520" y="260" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="22">✓</text>

  <!-- Bottom insight -->
  <rect x="40" y="290" width="620" height="38" fill="rgba(255,204,0,0.06)" rx="6"/>
  <text x="350" y="314" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="12" font-weight="bold">PageRank = WHO endorses you × how selective they are | In-Degree = just HOW MANY</text>
</svg>
