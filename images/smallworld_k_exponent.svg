<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="850" height="520" fill="url(#bg4)" rx="12"/>
  <text x="425" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Kleinberg's Exponent k — Effect on Decentralized Search</text>
  <text x="425" y="55" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">P(u,v) ∝ 1/d(u,v)ᵏ — How far do long-range links reach?</text>

  <!-- k=0 Column -->
  <rect x="30" y="75" width="240" height="280" rx="10" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1"/>
  <text x="150" y="100" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="14" font-weight="bold">k = 0 (Uniform Random)</text>
  <!-- Grid nodes for k=0 -->
  <circle cx="80" cy="150" r="6" fill="#6366f1"/>
  <circle cx="120" cy="150" r="6" fill="#6366f1"/>
  <circle cx="160" cy="150" r="6" fill="#6366f1"/>
  <circle cx="200" cy="150" r="6" fill="#6366f1"/>
  <circle cx="80" cy="190" r="6" fill="#6366f1"/>
  <circle cx="120" cy="190" r="6" fill="#6366f1"/>
  <circle cx="160" cy="190" r="6" fill="#6366f1"/>
  <circle cx="200" cy="190" r="6" fill="#6366f1"/>
  <circle cx="80" cy="230" r="6" fill="#6366f1"/>
  <circle cx="120" cy="230" r="6" fill="#6366f1"/>
  <circle cx="160" cy="230" r="6" fill="#6366f1"/>
  <circle cx="200" cy="230" r="6" fill="#6366f1"/>
  <!-- Random long-range links -->
  <line x1="80" y1="150" x2="200" y2="230" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="120" y1="190" x2="200" y2="150" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="160" y1="230" x2="80" y2="150" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="150" y="270" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="10">Links go everywhere randomly</text>
  <text x="150" y="290" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="10">No sense of direction</text>
  <text x="150" y="315" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Short paths EXIST</text>
  <text x="150" y="335" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="11" font-weight="bold">but can't be FOUND locally</text>

  <!-- k=2 Column (Sweet spot) -->
  <rect x="300" y="75" width="240" height="280" rx="10" fill="#22c55e" opacity="0.12" stroke="#22c55e" stroke-width="2"/>
  <text x="420" y="100" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="14" font-weight="bold">k = 2 (Optimal ✓)</text>
  <!-- Grid nodes for k=2 -->
  <circle cx="350" cy="150" r="6" fill="#22c55e"/>
  <circle cx="390" cy="150" r="6" fill="#22c55e"/>
  <circle cx="430" cy="150" r="6" fill="#22c55e"/>
  <circle cx="470" cy="150" r="6" fill="#22c55e"/>
  <circle cx="350" cy="190" r="6" fill="#22c55e"/>
  <circle cx="390" cy="190" r="6" fill="#22c55e"/>
  <circle cx="430" cy="190" r="6" fill="#22c55e"/>
  <circle cx="470" cy="190" r="6" fill="#22c55e"/>
  <circle cx="350" cy="230" r="6" fill="#22c55e"/>
  <circle cx="390" cy="230" r="6" fill="#22c55e"/>
  <circle cx="430" cy="230" r="6" fill="#22c55e"/>
  <circle cx="470" cy="230" r="6" fill="#22c55e"/>
  <!-- Hierarchical links: short, medium, long -->
  <line x1="350" y1="150" x2="390" y2="190" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="390" y1="150" x2="470" y2="190" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,2"/>
  <line x1="350" y1="230" x2="470" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="420" y="265" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Links at EVERY scale:</text>
  <text x="420" y="282" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="9">short (blocks), medium (cities), long (continents)</text>
  <text x="420" y="315" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Short paths EXIST</text>
  <text x="420" y="335" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">AND can be FOUND locally ✓</text>

  <!-- k >> 2 Column -->
  <rect x="570" y="75" width="240" height="280" rx="10" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="1"/>
  <text x="690" y="100" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="bold">k >> 2 (Too Local)</text>
  <!-- Grid nodes for k>>2 -->
  <circle cx="620" cy="150" r="6" fill="#f59e0b"/>
  <circle cx="660" cy="150" r="6" fill="#f59e0b"/>
  <circle cx="700" cy="150" r="6" fill="#f59e0b"/>
  <circle cx="740" cy="150" r="6" fill="#f59e0b"/>
  <circle cx="620" cy="190" r="6" fill="#f59e0b"/>
  <circle cx="660" cy="190" r="6" fill="#f59e0b"/>
  <circle cx="700" cy="190" r="6" fill="#f59e0b"/>
  <circle cx="740" cy="190" r="6" fill="#f59e0b"/>
  <circle cx="620" cy="230" r="6" fill="#f59e0b"/>
  <circle cx="660" cy="230" r="6" fill="#f59e0b"/>
  <circle cx="700" cy="230" r="6" fill="#f59e0b"/>
  <circle cx="740" cy="230" r="6" fill="#f59e0b"/>
  <!-- Very short "long-range" links -->
  <line x1="620" y1="150" x2="660" y2="150" stroke="#fbbf24" stroke-width="2"/>
  <line x1="660" y1="190" x2="700" y2="190" stroke="#fbbf24" stroke-width="2"/>
  <line x1="700" y1="230" x2="740" y2="230" stroke="#fbbf24" stroke-width="2"/>
  <line x1="620" y1="190" x2="660" y2="230" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="270" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">"Shortcuts" are barely longer</text>
  <text x="690" y="287" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">than local edges</text>
  <text x="690" y="315" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Paths are LONG</text>
  <text x="690" y="335" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Too many hops needed</text>

  <!-- Transport analogy bar -->
  <rect x="50" y="380" width="750" height="120" rx="8" fill="#1e1b4b" opacity="0.65" stroke="#6366f1" stroke-width="1"/>
  <text x="425" y="405" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="13" font-weight="bold">🚇 Public Transport Analogy</text>
  <text x="185" y="430" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="11">k=0: Only express trains</text>
  <text x="185" y="448" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="10">Skip your stop — can't reach it</text>
  <text x="425" y="430" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">k=2: Express + Local + Metro</text>
  <text x="425" y="448" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Perfect mix — reach anywhere fast</text>
  <text x="665" y="430" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11">k>>2: Only local buses</text>
  <text x="665" y="448" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">Can reach everywhere, slowly</text>
  <text x="425" y="480" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Optimal search in a 2D grid requires k = dimension of the grid = 2</text>
</svg>
