<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg2)" rx="12"/>
  <text x="360" y="32" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Cluster Density Theorem — When Cascades Are Blocked</text>
  
  <!-- Left: Dense cluster blocks -->
  <rect x="30" y="55" width="310" height="160" fill="rgba(255,107,107,0.08)" rx="10" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="185" y="78" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Dense Cluster (density > 1−q)</text>
  <text x="185" y="95" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="12">CASCADE BLOCKED ✗</text>
  
  <!-- Dense cluster nodes -->
  <circle cx="120" cy="140" r="14" fill="#ff6b6b" opacity="0.85"/><text x="120" y="145" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="185" cy="120" r="14" fill="#ff6b6b" opacity="0.85"/><text x="185" y="125" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="250" cy="140" r="14" fill="#ff6b6b" opacity="0.85"/><text x="250" y="145" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="150" cy="185" r="14" fill="#ff6b6b" opacity="0.85"/><text x="150" y="190" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="220" cy="185" r="14" fill="#ff6b6b" opacity="0.85"/><text x="220" y="190" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <!-- Dense edges -->
  <line x1="120" y1="140" x2="185" y2="120" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="185" y1="120" x2="250" y2="140" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="140" x2="150" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="250" y1="140" x2="220" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="150" y1="185" x2="220" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="140" x2="250" y2="140" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="140" x2="220" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="185" y1="120" x2="150" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="185" y1="120" x2="220" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  <line x1="250" y1="140" x2="150" y2="185" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Right: Sparse cluster allows -->
  <rect x="380" y="55" width="310" height="160" fill="rgba(83,216,251,0.08)" rx="10" stroke="#53d8fb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="535" y="78" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Sparse Cluster (density ≤ 1−q)</text>
  <text x="535" y="95" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="12">CASCADE ENTERS ✓</text>
  
  <!-- Sparse cluster nodes -->
  <circle cx="450" cy="140" r="14" fill="#2ecc71" opacity="0.85"/><text x="450" y="145" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B</text>
  <circle cx="535" cy="120" r="14" fill="#53d8fb" opacity="0.85"/><text x="535" y="125" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="620" cy="140" r="14" fill="#53d8fb" opacity="0.85"/><text x="620" y="145" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="480" cy="185" r="14" fill="#53d8fb" opacity="0.85"/><text x="480" y="190" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <circle cx="590" cy="185" r="14" fill="#53d8fb" opacity="0.85"/><text x="590" y="190" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A</text>
  <!-- Sparse edges -->
  <line x1="450" y1="140" x2="535" y2="120" stroke="#53d8fb" stroke-width="1.5" opacity="0.5"/>
  <line x1="535" y1="120" x2="620" y2="140" stroke="#53d8fb" stroke-width="1.5" opacity="0.5"/>
  <line x1="450" y1="140" x2="480" y2="185" stroke="#53d8fb" stroke-width="1.5" opacity="0.5"/>
  <line x1="620" y1="140" x2="590" y2="185" stroke="#53d8fb" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Formula section -->
  <rect x="40" y="240" width="640" height="80" fill="rgba(255,255,255,0.05)" rx="10"/>
  <text x="360" y="268" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="15" font-weight="bold">The Cluster Density Theorem</text>
  <text x="360" y="292" text-anchor="middle" fill="white" font-family="monospace" font-size="14">density = edges_within / C(k,2) > 1 − q  →  CASCADE BLOCKED</text>
  <text x="360" y="312" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">Lower q (easy adoption) requires very dense clusters to block  |  Higher q (hard adoption) any sparse cluster blocks</text>

  <!-- Table -->
  <rect x="40" y="335" width="640" height="70" fill="rgba(255,255,255,0.03)" rx="8"/>
  <text x="160" y="358" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Threshold q</text>
  <text x="360" y="358" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Blocking density</text>
  <text x="560" y="358" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Interpretation</text>
  <line x1="60" y1="365" x2="660" y2="365" stroke="#444" stroke-width="0.5"/>
  <text x="160" y="382" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="11">q=0.2 | q=0.5 | q=0.8</text>
  <text x="360" y="382" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="11">>0.8  |  >0.5  |  >0.2</text>
  <text x="560" y="382" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">Very dense | Medium | Any cluster</text>
</svg>
