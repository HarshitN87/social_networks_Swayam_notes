<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgP)" rx="12"/>
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Cascade Capacity vs Shell Index — The Pseudo-Core Plateau</text>

  <!-- Axes -->
  <line x1="100" y1="330" x2="720" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="330" x2="100" y2="70" stroke="#475569" stroke-width="2"/>
  <!-- X axis label -->
  <text x="410" y="365" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Shell Index (k) →</text>
  <!-- Y axis label -->
  <text x="55" y="200" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12" transform="rotate(-90,55,200)">Cascade Capacity (%) →</text>

  <!-- X ticks -->
  <text x="120" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">1</text>
  <text x="200" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">5</text>
  <text x="310" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">15</text>
  <text x="440" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">25</text>
  <text x="540" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">32</text>
  <text x="620" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">40</text>
  <text x="700" y="348" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">45</text>

  <!-- Y ticks -->
  <text x="90" y="330" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="10">0%</text>
  <text x="90" y="265" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="10">20%</text>
  <text x="90" y="200" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="10">40%</text>
  <text x="90" y="135" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="10">60%</text>
  <text x="90" y="100" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="10">70%</text>
  <!-- Grid lines -->
  <line x1="100" y1="265" x2="720" y2="265" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="200" x2="720" y2="200" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="135" x2="720" y2="135" stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Curve: sharply rising then plateau -->
  <path d="M 120,320 C 150,318 180,310 200,300 C 240,275 280,230 320,180 C 360,145 400,120 440,110 C 480,105 520,102 560,100 C 600,100 640,99 680,98 L 700,98" fill="none" stroke="#4ade80" stroke-width="3"/>

  <!-- Shaded plateau region -->
  <rect x="440" y="80" width="270" height="45" rx="6" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="575" y="75" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PLATEAU — cascade capacity levels off</text>

  <!-- Pseudo-core bracket -->
  <line x1="440" y1="370" x2="620" y2="370" stroke="#fbbf24" stroke-width="2"/>
  <line x1="440" y1="365" x2="440" y2="375" stroke="#fbbf24" stroke-width="2"/>
  <line x1="620" y1="365" x2="620" y2="375" stroke="#fbbf24" stroke-width="2"/>
  <text x="530" y="388" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Pseudo-Core Shells</text>
  <text x="530" y="402" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">Same cascade capacity as absolute core!</text>

  <!-- Inner core label -->
  <line x1="680" y1="370" x2="700" y2="370" stroke="#ef4444" stroke-width="2"/>
  <line x1="680" y1="365" x2="680" y2="375" stroke="#ef4444" stroke-width="2"/>
  <line x1="700" y1="365" x2="700" y2="375" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="388" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="9">Core</text>

  <!-- Peripheral region label -->
  <line x1="120" y1="370" x2="200" y2="370" stroke="#6366f1" stroke-width="2"/>
  <line x1="120" y1="365" x2="120" y2="375" stroke="#6366f1" stroke-width="2"/>
  <line x1="200" y1="365" x2="200" y2="375" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="388" text-anchor="middle" fill="#818cf8" font-family="Arial,sans-serif" font-size="9">Periphery</text>

  <!-- Annotation arrows -->
  <!-- Small cascade at periphery -->
  <circle cx="160" cy="312" r="4" fill="#6366f1"/>
  <text x="170" y="300" fill="#818cf8" font-family="Arial,sans-serif" font-size="9">~5% cascade</text>
  <!-- Identical at pseudo vs core -->
  <circle cx="540" cy="101" r="4" fill="#f59e0b"/>
  <circle cx="700" cy="98" r="4" fill="#ef4444"/>
  <line x1="545" y1="98" x2="695" y2="98" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="620" y="92" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">≈ same!</text>
</svg>
