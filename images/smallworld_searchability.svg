<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bg5)" rx="12"/>
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Shortest Paths vs. Discoverable Paths</text>

  <!-- Two-column comparison -->
  <!-- Left: Short paths exist -->
  <rect x="30" y="55" width="350" height="170" rx="10" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1"/>
  <text x="205" y="80" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Short Paths EXIST</text>
  <text x="205" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">(Graph theory — structural property)</text>
  <text x="55" y="125" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">• Watts-Strogatz: even 1% rewiring</text>
  <text x="55" y="145" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">  creates short paths</text>
  <text x="55" y="165" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">• Any random long-range links shrink</text>
  <text x="55" y="185" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">  the diameter of the network</text>
  <text x="55" y="210" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11" font-weight="bold">⚠ NOT sufficient for navigation!</text>

  <!-- Right: Paths are discoverable -->
  <rect x="420" y="55" width="350" height="170" rx="10" fill="#22c55e" opacity="0.12" stroke="#22c55e" stroke-width="1"/>
  <text x="595" y="80" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Paths are DISCOVERABLE</text>
  <text x="595" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">(Algorithmic — navigability property)</text>
  <text x="445" y="125" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">• Kleinberg: requires k = dimension</text>
  <text x="445" y="145" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">  (k=2 for 2D grid)</text>
  <text x="445" y="165" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">• Distance-aware link distribution</text>
  <text x="445" y="185" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">• Greedy local forwarding succeeds</text>
  <text x="445" y="210" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">✓ Local decisions align with structure</text>

  <!-- Key insight box -->
  <rect x="80" y="245" width="640" height="65" rx="8" fill="#dc2626" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="270" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="13" font-weight="bold">⚠ Critical Distinction (Kleinberg's Key Insight)</text>
  <text x="400" y="292" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="12">A "small world" (short paths exist) is NOT automatically "searchable" (paths can be found locally)</text>

  <!-- Table -->
  <!-- Header -->
  <rect x="60" y="330" width="220" height="30" rx="4" fill="#334155"/>
  <text x="170" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Network Type</text>
  <rect x="280" y="330" width="140" height="30" rx="4" fill="#334155"/>
  <text x="350" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Short Paths?</text>
  <rect x="420" y="330" width="140" height="30" rx="4" fill="#334155"/>
  <text x="490" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Searchable?</text>
  <rect x="560" y="330" width="180" height="30" rx="4" fill="#334155"/>
  <text x="650" y="350" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Why?</text>
  <!-- Row 1 -->
  <rect x="60" y="362" width="220" height="25" rx="2" fill="#1e293b"/>
  <text x="170" y="379" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Regular lattice (k=0 rewire)</text>
  <rect x="280" y="362" width="140" height="25" rx="2" fill="#1e293b"/>
  <text x="350" y="379" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">No ✗</text>
  <rect x="420" y="362" width="140" height="25" rx="2" fill="#1e293b"/>
  <text x="490" y="379" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">No ✗</text>
  <rect x="560" y="362" width="180" height="25" rx="2" fill="#1e293b"/>
  <text x="650" y="379" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">No shortcuts at all</text>
  <!-- Row 2 -->
  <rect x="60" y="389" width="220" height="25" rx="2" fill="#0f172a"/>
  <text x="170" y="406" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Random shortcuts (k=0)</text>
  <rect x="280" y="389" width="140" height="25" rx="2" fill="#0f172a"/>
  <text x="350" y="406" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Yes ✓</text>
  <rect x="420" y="389" width="140" height="25" rx="2" fill="#0f172a"/>
  <text x="490" y="406" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">No ✗</text>
  <rect x="560" y="389" width="180" height="25" rx="2" fill="#0f172a"/>
  <text x="650" y="406" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Links too random to navigate</text>
  <!-- Row 3 -->
  <rect x="60" y="416" width="220" height="25" rx="2" fill="#14532d" opacity="0.3"/>
  <text x="170" y="433" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Structured shortcuts (k=2)</text>
  <rect x="280" y="416" width="140" height="25" rx="2" fill="#14532d" opacity="0.3"/>
  <text x="350" y="433" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Yes ✓</text>
  <rect x="420" y="416" width="140" height="25" rx="2" fill="#14532d" opacity="0.3"/>
  <text x="490" y="433" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Yes ✓</text>
  <rect x="560" y="416" width="180" height="25" rx="2" fill="#14532d" opacity="0.3"/>
  <text x="650" y="433" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">Distance-aware distribution</text>
</svg>
