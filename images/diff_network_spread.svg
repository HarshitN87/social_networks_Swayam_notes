<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#f8fafc" rx="14" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Diffusion Through a Network — The Shoe Example</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#64748b">Adoption spreads outward in waves from the initial buyer</text>

  <!-- Wave rings (background) -->
  <circle cx="340" cy="210" r="44"  fill="#fee2e2" opacity="0.5"/>
  <circle cx="340" cy="210" r="90"  fill="#fef3c7" opacity="0.5"/>
  <circle cx="340" cy="210" r="140" fill="#dcfce7" opacity="0.4"/>
  <circle cx="340" cy="210" r="190" fill="#eff6ff" opacity="0.4"/>

  <!-- Wave labels -->
  <text x="410" y="194" font-size="10" fill="#991b1b" font-weight="bold">Wave 0</text>
  <text x="434" y="151" font-size="10" fill="#92400e">Wave 1</text>
  <text x="486" y="115" font-size="10" fill="#166534">Wave 2</text>
  <text x="528" y="80"  font-size="10" fill="#1e40af">Wave 3</text>

  <!-- WAVE 0: Initial adopter (centre) -->
  <circle cx="340" cy="210" r="22" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
  <text x="340" cy="210" y="206" text-anchor="middle" font-size="10" font-weight="bold" fill="white">YOU</text>
  <text x="340" y="220" text-anchor="middle" font-size="9" fill="#fee2e2">🥿 Buyer</text>

  <!-- WAVE 1: 5 direct friends -->
  <!-- North -->
  <line x1="340" y1="187" x2="340" y2="147" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="340" cy="130" r="18" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="340" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="white">F1</text>

  <!-- NE -->
  <line x1="354" y1="196" x2="388" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="402" cy="158" r="18" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="402" y="162" text-anchor="middle" font-size="9" font-weight="bold" fill="white">F2</text>

  <!-- East -->
  <line x1="362" y1="210" x2="406" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="422" cy="210" r="18" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="422" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="white">F3</text>

  <!-- SW -->
  <line x1="326" y1="224" x2="293" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="278" cy="264" r="18" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="278" y="268" text-anchor="middle" font-size="9" font-weight="bold" fill="white">F4</text>

  <!-- West -->
  <line x1="318" y1="210" x2="278" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="260" cy="210" r="18" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="260" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="white">F5</text>

  <!-- WAVE 2: 8 second-level adopters (green) -->
  <!-- Around F1 (340,130) -->
  <circle cx="285" cy="90" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="285" y="94" text-anchor="middle" font-size="8" fill="white">G1</text>
  <line x1="330" y1="117" x2="297" y2="99" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <circle cx="395" cy="90" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="395" y="94" text-anchor="middle" font-size="8" fill="white">G2</text>
  <line x1="350" y1="117" x2="383" y2="99" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Around F2 (402,158) -->
  <circle cx="462" cy="130" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="462" y="134" text-anchor="middle" font-size="8" fill="white">G3</text>
  <line x1="417" y1="148" x2="451" y2="135" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Around F3 (422,210) -->
  <circle cx="490" cy="180" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="490" y="184" text-anchor="middle" font-size="8" fill="white">G4</text>
  <line x1="438" y1="200" x2="479" y2="184" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <circle cx="492" cy="240" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="492" y="244" text-anchor="middle" font-size="8" fill="white">G5</text>
  <line x1="438" y1="220" x2="480" y2="235" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Around F4 (278,264) -->
  <circle cx="240" cy="310" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="240" y="314" text-anchor="middle" font-size="8" fill="white">G6</text>
  <line x1="272" y1="277" x2="247" y2="300" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Around F5 (260,210) -->
  <circle cx="195" cy="175" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="195" y="179" text-anchor="middle" font-size="8" fill="white">G7</text>
  <line x1="247" y1="200" x2="208" y2="181" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <circle cx="190" cy="248" r="15" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <text x="190" y="252" text-anchor="middle" font-size="8" fill="white">G8</text>
  <line x1="247" y1="220" x2="203" y2="242" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- WAVE 3: 4 outer nodes (blue) -->
  <circle cx="147" cy="148" r="13" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="147" y="152" text-anchor="middle" font-size="8" fill="white">H1</text>

  <circle cx="565" cy="195" r="13" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="565" y="199" text-anchor="middle" font-size="8" fill="white">H2</text>

  <circle cx="175" cy="340" r="13" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="175" y="344" text-anchor="middle" font-size="8" fill="white">H3</text>

  <circle cx="495" cy="320" r="13" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="495" y="324" text-anchor="middle" font-size="8" fill="white">H4</text>

  <!-- Legend -->
  <rect x="14" y="355" width="650" height="36" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50"  cy="373" r="9" fill="#dc2626"/>
  <text x="65"  y="377" font-size="11" fill="#1e293b">Wave 0 (initial buyer)</text>
  <circle cx="200" cy="373" r="9" fill="#f97316"/>
  <text x="215" y="377" font-size="11" fill="#1e293b">Wave 1 (direct friends)</text>
  <circle cx="360" cy="373" r="9" fill="#22c55e"/>
  <text x="375" y="377" font-size="11" fill="#1e293b">Wave 2 (friends of friends)</text>
  <circle cx="535" cy="373" r="9" fill="#3b82f6"/>
  <text x="550" y="377" font-size="11" fill="#1e293b">Wave 3+</text>
</svg>
