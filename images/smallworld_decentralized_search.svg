<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="url(#bg3)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Greedy Decentralized Search — How Local Decisions Find Short Paths</text>

  <!-- Grid with clusters -->
  <!-- Cluster A: top-left -->
  <rect x="50" y="60" width="200" height="140" rx="10" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="150" y="82" text-anchor="middle" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="11">Cluster A (Sender's region)</text>
  <circle cx="90" cy="130" r="12" fill="#22c55e" filter="url(#glow3)"/>
  <text x="90" y="134" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">S</text>
  <circle cx="140" cy="110" r="8" fill="#6366f1"/>
  <circle cx="180" cy="140" r="8" fill="#6366f1"/>
  <circle cx="130" cy="170" r="8" fill="#6366f1"/>
  <circle cx="200" cy="110" r="8" fill="#6366f1"/>
  <!-- Local edges in A -->
  <line x1="90" y1="130" x2="140" y2="110" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="90" y1="130" x2="130" y2="170" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="140" y1="110" x2="180" y2="140" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="140" y1="110" x2="200" y2="110" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="180" y1="140" x2="130" y2="170" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Cluster B: middle -->
  <rect x="300" y="100" width="200" height="140" rx="10" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="122" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11">Cluster B (Intermediate)</text>
  <circle cx="340" cy="170" r="8" fill="#a855f7"/>
  <circle cx="390" cy="150" r="8" fill="#a855f7"/>
  <circle cx="430" cy="180" r="8" fill="#a855f7"/>
  <circle cx="460" cy="150" r="8" fill="#a855f7"/>
  <circle cx="380" cy="210" r="8" fill="#a855f7"/>
  <line x1="340" y1="170" x2="390" y2="150" stroke="#c084fc" stroke-width="1.5"/>
  <line x1="390" y1="150" x2="430" y2="180" stroke="#c084fc" stroke-width="1.5"/>
  <line x1="430" y1="180" x2="460" y2="150" stroke="#c084fc" stroke-width="1.5"/>
  <line x1="340" y1="170" x2="380" y2="210" stroke="#c084fc" stroke-width="1.5"/>
  <line x1="390" y1="150" x2="380" y2="210" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Cluster C: right -->
  <rect x="570" y="60" width="200" height="140" rx="10" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="670" y="82" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11">Cluster C (Target's region)</text>
  <circle cx="620" cy="130" r="8" fill="#ef4444"/>
  <circle cx="660" cy="110" r="8" fill="#ef4444"/>
  <circle cx="700" cy="140" r="8" fill="#ef4444"/>
  <circle cx="720" cy="110" r="12" fill="#f59e0b" filter="url(#glow3)"/>
  <text x="720" y="114" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">T</text>
  <circle cx="660" cy="170" r="8" fill="#ef4444"/>
  <line x1="620" y1="130" x2="660" y2="110" stroke="#f87171" stroke-width="1.5"/>
  <line x1="660" y1="110" x2="700" y2="140" stroke="#f87171" stroke-width="1.5"/>
  <line x1="700" y1="140" x2="720" y2="110" stroke="#f87171" stroke-width="1.5"/>
  <line x1="620" y1="130" x2="660" y2="170" stroke="#f87171" stroke-width="1.5"/>
  <line x1="660" y1="110" x2="660" y2="170" stroke="#f87171" stroke-width="1.5"/>

  <!-- Long-range shortcut: A → B (weak tie) -->
  <path d="M 200,110 C 250,60 290,100 340,170" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowY)"/>
  <text x="270" y="78" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Weak tie (shortcut)</text>

  <!-- Long-range shortcut: B → C (weak tie) -->
  <path d="M 460,150 C 510,90 560,100 620,130" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowY)"/>
  <text x="540" y="90" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Weak tie (shortcut)</text>

  <!-- Search path (green) -->
  <path d="M 102,130 L 140,110" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowG)"/>
  <path d="M 148,110 L 192,110" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowG)"/>

  <!-- Step labels -->
  <text x="118" y="108" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">1</text>
  <text x="168" y="102" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">2</text>
  <text x="268" y="96" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">3</text>
  <text x="540" y="108" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">4</text>

  <!-- Bottom explanation boxes -->
  <rect x="40" y="260" width="340" height="100" rx="8" fill="#1e1b4b" opacity="0.7" stroke="#6366f1" stroke-width="1"/>
  <text x="210" y="285" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Homophily (Local Clustering)</text>
  <text x="210" y="305" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Dense connections within similar groups</text>
  <text x="210" y="322" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Messages circulate locally first</text>
  <text x="210" y="339" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Provides final-mile delivery to target</text>

  <rect x="420" y="260" width="340" height="100" rx="8" fill="#1e1b4b" opacity="0.7" stroke="#fbbf24" stroke-width="1"/>
  <text x="590" y="285" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Weak Ties (Long-Range Bridges)</text>
  <text x="590" y="305" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Rare but crucial cross-cluster connections</text>
  <text x="590" y="322" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Enable jumps between distant regions</text>
  <text x="590" y="339" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">• Without them, search gets stuck locally</text>

  <!-- Greedy algorithm box -->
  <rect x="120" y="380" width="560" height="80" rx="8" fill="#14532d" opacity="0.5" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Greedy Algorithm: At each step, forward to the neighbor closest to Target</text>
  <text x="400" y="425" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11">No global map needed — each person uses only LOCAL knowledge of their contacts</text>
  <text x="400" y="445" text-anchor="middle" fill="#86efac" font-family="Arial,sans-serif" font-size="11">Homophily + Well-placed weak ties = short discoverable paths</text>
</svg>
