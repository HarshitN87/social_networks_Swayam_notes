<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="360" fill="#f8fafc" rx="14" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Damping Factor &amp; Sink Node Problem</text>

  <!-- ══ TOP HALF: Sink Node Problem ══ -->
  <rect x="14" y="45" width="652" height="130" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="340" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">❌ Without Damping — Sink Nodes Drain All Points</text>

  <!-- Nodes S1 S2 Sink -->
  <!-- S1(130, 120) → S2(280, 120) → SINK(450, 120) ← loop from S2 back? No, it's a sink -->

  <!-- Edges -->
  <line x1="168" y1="120" x2="244" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="120" x2="392" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- S1 also has self arrow pointing nowhere else notable -->

  <!-- S1 -->
  <circle cx="140" cy="120" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="white">S1</text>
  <text x="140" y="130" text-anchor="middle" font-size="10" fill="#dbeafe">100🪙</text>

  <!-- S2 -->
  <circle cx="282" cy="120" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="282" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="white">S2</text>
  <text x="282" y="130" text-anchor="middle" font-size="10" fill="#dbeafe">100🪙</text>

  <!-- Sink node -->
  <circle cx="430" cy="120" r="28" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <text x="430" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="white">SINK</text>
  <text x="430" y="124" text-anchor="middle" font-size="10" fill="#fee2e2">no outlinks</text>
  <text x="430" y="137" text-anchor="middle" font-size="10" fill="#fee2e2">→ ∞ 🪙</text>

  <!-- Arrow indicating flow into sink -->
  <text x="356" y="105" text-anchor="middle" font-size="10" fill="#dc2626">all points →</text>

  <!-- Explanation -->
  <text x="560" y="105" text-anchor="middle" font-size="11" fill="#7f1d1d">Random walk</text>
  <text x="560" y="120" text-anchor="middle" font-size="11" fill="#7f1d1d">gets STUCK here.</text>
  <text x="560" y="135" text-anchor="middle" font-size="11" fill="#7f1d1d">All mass drains in.</text>
  <text x="560" y="150" text-anchor="middle" font-size="11" fill="#7f1d1d">No convergence!</text>

  <!-- ══ BOTTOM HALF: With Damping ══ -->
  <rect x="14" y="188" width="652" height="158" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">✅ With Damping Factor d = 0.85 — Teleportation Saves the Walk</text>

  <!-- Formula -->
  <text x="340" y="232" text-anchor="middle" font-size="13" fill="#1e293b">PR(v)  =</text>
  <rect x="376" y="218" width="200" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="476" y="238" text-anchor="middle" font-size="12" fill="#1d4ed8">d · Σ PR(u) / out(u)</text>
  <text x="594" y="232" font-size="13" fill="#1e293b">+</text>
  <rect x="608" y="218" width="60" height="32" rx="6" fill="#dcfce7" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="638" y="238" text-anchor="middle" font-size="12" fill="#065f46">(1−d)/n</text>

  <!-- Labels below formula -->
  <text x="476" y="263" text-anchor="middle" font-size="10" fill="#1d4ed8">↑ follow links</text>
  <text x="638" y="263" text-anchor="middle" font-size="10" fill="#065f46">↑ teleport</text>

  <!-- Two behaviors -->
  <rect x="30" y="274" width="290" height="62" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="175" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">With prob d = 0.85</text>
  <text x="175" y="310" text-anchor="middle" font-size="11" fill="#1e40af">Follow a random outgoing link</text>
  <text x="175" y="326" text-anchor="middle" font-size="11" fill="#1e40af">Normal web-surfing behaviour</text>

  <text x="338" y="305" text-anchor="middle" font-size="20" fill="#64748b">OR</text>

  <rect x="360" y="274" width="306" height="62" rx="10" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="513" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">With prob (1−d) = 0.15</text>
  <text x="513" y="310" text-anchor="middle" font-size="11" fill="#166534">Teleport → jump to ANY random page</text>
  <text x="513" y="326" text-anchor="middle" font-size="11" fill="#166534">Escapes sink nodes · ensures convergence</text>
</svg>
