<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#1e1b4b" rx="12"/>
  <text x="350" y="28" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="16" font-weight="bold">Biological vs Social Contagion</text>

  <!-- LEFT: Social Contagion -->
  <rect x="20" y="45" width="320" height="280" fill="#312e81" stroke="#34d399" stroke-width="2" rx="10"/>
  <text x="180" y="70" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="14" font-weight="bold">💡 Social Contagion (Ideas)</text>

  <circle cx="100" cy="120" r="22" fill="#059669" stroke="#34d399" stroke-width="2"/>
  <text x="100" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">A</text>
  <circle cx="220" cy="120" r="22" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="220" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">B</text>
  <line x1="122" y1="120" x2="198" y2="120" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="160" y="112" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="9">shares idea</text>

  <!-- Thought bubble -->
  <rect x="200" y="150" width="120" height="25" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" rx="12"/>
  <text x="260" y="167" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="9">🤔 "Should I adopt?"</text>

  <text x="50" y="200" fill="#a7f3d0" font-family="Arial" font-size="11">✓ Conscious choice to adopt</text>
  <text x="50" y="220" fill="#a7f3d0" font-family="Arial" font-size="11">✓ Source is known ("A told me")</text>
  <text x="50" y="240" fill="#a7f3d0" font-family="Arial" font-size="11">✓ Evaluation of quality</text>
  <text x="50" y="260" fill="#a7f3d0" font-family="Arial" font-size="11">✓ Visible, transparent process</text>
  <text x="50" y="285" fill="#34d399" font-family="Arial" font-size="11" font-weight="bold">Model: Threshold / Coordination</text>
  <text x="50" y="305" fill="#94a3b8" font-family="Arial" font-size="10">Examples: trends, apps, behaviors</text>

  <!-- RIGHT: Biological Contagion -->
  <rect x="360" y="45" width="320" height="280" fill="#312e81" stroke="#f87171" stroke-width="2" rx="10"/>
  <text x="520" y="70" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="14" font-weight="bold">🦠 Biological Contagion (Disease)</text>

  <circle cx="440" cy="120" r="22" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
  <text x="440" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">A</text>
  <circle cx="560" cy="120" r="22" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">B</text>
  <line x1="462" y1="120" x2="538" y2="120" stroke="#f87171" stroke-width="2"/>
  <text x="500" y="112" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="9">infects (p)</text>

  <!-- No choice -->
  <rect x="535" y="150" width="130" height="25" fill="#7f1d1d" stroke="#f87171" stroke-width="1" rx="12"/>
  <text x="600" y="167" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="9">😷 No choice — infected!</text>

  <text x="390" y="200" fill="#fca5a5" font-family="Arial" font-size="11">✗ No conscious choice (involuntary)</text>
  <text x="390" y="220" fill="#fca5a5" font-family="Arial" font-size="11">✗ Source unknown ("who gave it?")</text>
  <text x="390" y="240" fill="#fca5a5" font-family="Arial" font-size="11">✗ No quality evaluation</text>
  <text x="390" y="260" fill="#fca5a5" font-family="Arial" font-size="11">✗ Invisible, opaque process</text>
  <text x="390" y="285" fill="#f87171" font-family="Arial" font-size="11" font-weight="bold">Model: SIR / SIS (probabilistic)</text>
  <text x="390" y="305" fill="#94a3b8" font-family="Arial" font-size="10">Examples: flu, measles, COVID</text>

  <!-- VS divider -->
  <line x1="350" y1="55" x2="350" y2="320" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="8,4"/>
  <circle cx="350" cy="120" r="14" fill="#4f46e5"/>
  <text x="350" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">vs</text>
</svg>
