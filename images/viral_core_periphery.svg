<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgCP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowCP">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bgCP)" rx="12"/>
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Core-Periphery Structure — Why Coreness Beats Degree</text>

  <!-- Left side: High Degree but Low Coreness -->
  <rect x="30" y="50" width="350" height="290" rx="10" fill="#ef4444" opacity="0.06" stroke="#ef4444" stroke-width="1"/>
  <text x="205" y="75" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="13" font-weight="bold">High Degree, Low Coreness</text>
  <text x="205" y="92" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">"Celebrity in a dead-end neighborhood"</text>
  <!-- Star topology: high degree hub connected to leaves -->
  <circle cx="205" cy="195" r="18" fill="#ef4444" filter="url(#glowCP)"/>
  <text x="205" y="199" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">deg=8</text>
  <!-- Leaf nodes (degree 1 each) -->
  <circle cx="120" cy="140" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="120" y2="140" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="290" cy="140" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="290" y2="140" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="90" cy="195" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="90" y2="195" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="320" cy="195" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="320" y2="195" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="120" cy="250" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="120" y2="250" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="290" cy="250" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="290" y2="250" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="155" cy="270" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="155" y2="270" stroke="#818cf8" stroke-width="1.2"/>
  <circle cx="255" cy="270" r="6" fill="#6366f1" opacity="0.5"/><line x1="205" y1="195" x2="255" y2="270" stroke="#818cf8" stroke-width="1.2"/>
  <!-- Labels -->
  <text x="205" y="305" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">Neighbors are all degree-1 (leaves)</text>
  <text x="205" y="322" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Coreness = 1 (removed in first iteration!)</text>

  <!-- Right side: Lower Degree but High Coreness -->
  <rect x="420" y="50" width="350" height="290" rx="10" fill="#22c55e" opacity="0.08" stroke="#22c55e" stroke-width="1"/>
  <text x="595" y="75" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Moderate Degree, High Coreness</text>
  <text x="595" y="92" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">"Well-connected in a dense community"</text>
  <!-- Dense cluster: every node connected to many others -->
  <circle cx="560" cy="170" r="10" fill="#22c55e" filter="url(#glowCP)"/>
  <text x="560" y="173" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7">d=4</text>
  <circle cx="630" cy="170" r="10" fill="#22c55e"/>
  <text x="630" y="173" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7">d=4</text>
  <circle cx="595" cy="220" r="10" fill="#22c55e"/>
  <text x="595" y="223" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7">d=4</text>
  <circle cx="530" cy="220" r="10" fill="#22c55e"/>
  <text x="530" y="223" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7">d=4</text>
  <circle cx="660" cy="220" r="10" fill="#22c55e"/>
  <text x="660" y="223" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7">d=4</text>
  <!-- Fully connected edges -->
  <line x1="560" y1="170" x2="630" y2="170" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="560" y1="170" x2="595" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="560" y1="170" x2="530" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="560" y1="170" x2="660" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="630" y1="170" x2="595" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="630" y1="170" x2="530" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="630" y1="170" x2="660" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="595" y1="220" x2="530" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="595" y1="220" x2="660" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="530" y1="220" x2="660" y2="220" stroke="#4ade80" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="595" y="265" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Every neighbor is also high-degree</text>
  <text x="595" y="282" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Dense interconnections survive pruning</text>
  <text x="595" y="305" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Coreness = 4 (survives until late!)</text>
  <text x="595" y="322" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">→ BETTER spreader despite lower degree</text>

  <!-- Bottom banner -->
  <rect x="80" y="355" width="640" height="35" rx="6" fill="#1e1b4b" opacity="0.7" stroke="#c4b5fd" stroke-width="1"/>
  <text x="400" y="378" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Degree counts friends. Coreness measures how deeply embedded you are in a dense, resilient region.</text>
</svg>
