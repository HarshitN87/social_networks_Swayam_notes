<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" fill="url(#bg4)" rx="12"/>
  <text x="350" y="30" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Neighbourhood Overlap — Measuring Tie Strength</text>

  <!-- High overlap -->
  <rect x="25" y="50" width="310" height="180" fill="rgba(83,216,251,0.05)" rx="10"/>
  <text x="180" y="75" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="13" font-weight="bold">High Overlap (Strong Tie)</text>

  <circle cx="120" cy="145" r="16" fill="#53d8fb" opacity="0.85"/><text x="120" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11">X</text>
  <circle cx="240" cy="145" r="16" fill="#53d8fb" opacity="0.85"/><text x="240" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11">Y</text>
  <line x1="136" y1="145" x2="224" y2="145" stroke="#53d8fb" stroke-width="3" opacity="0.7"/>
  <!-- Common friends -->
  <circle cx="150" cy="100" r="9" fill="#ffcc00" opacity="0.7"/><line x1="120" y1="130" x2="150" y2="108" stroke="#ffcc00" stroke-width="1" opacity="0.5"/><line x1="240" y1="130" x2="150" y2="108" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <circle cx="180" cy="95" r="9" fill="#ffcc00" opacity="0.7"/><line x1="120" y1="130" x2="180" y2="103" stroke="#ffcc00" stroke-width="1" opacity="0.5"/><line x1="240" y1="130" x2="180" y2="103" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <circle cx="210" cy="100" r="9" fill="#ffcc00" opacity="0.7"/><line x1="120" y1="130" x2="210" y2="108" stroke="#ffcc00" stroke-width="1" opacity="0.5"/><line x1="240" y1="130" x2="210" y2="108" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <circle cx="160" cy="195" r="9" fill="#ffcc00" opacity="0.7"/><line x1="120" y1="160" x2="160" y2="188" stroke="#ffcc00" stroke-width="1" opacity="0.5"/><line x1="240" y1="160" x2="160" y2="188" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="195" r="9" fill="#ffcc00" opacity="0.7"/><line x1="120" y1="160" x2="200" y2="188" stroke="#ffcc00" stroke-width="1" opacity="0.5"/><line x1="240" y1="160" x2="200" y2="188" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
  <text x="180" y="222" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="11">5 mutual friends</text>

  <!-- Low overlap -->
  <rect x="365" y="50" width="310" height="180" fill="rgba(233,69,96,0.05)" rx="10"/>
  <text x="520" y="75" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Zero Overlap (Local Bridge)</text>

  <circle cx="460" cy="145" r="16" fill="#e94560" opacity="0.85"/><text x="460" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11">X</text>
  <circle cx="580" cy="145" r="16" fill="#e94560" opacity="0.85"/><text x="580" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11">Z</text>
  <line x1="476" y1="145" x2="564" y2="145" stroke="#ffcc00" stroke-width="2" stroke-dasharray="6,3" opacity="0.8"/>
  <!-- X's friends (no overlap) -->
  <circle cx="410" cy="105" r="8" fill="#53d8fb" opacity="0.5"/><line x1="460" y1="130" x2="410" y2="112" stroke="#53d8fb" stroke-width="1" opacity="0.3"/>
  <circle cx="410" cy="185" r="8" fill="#53d8fb" opacity="0.5"/><line x1="460" y1="160" x2="410" y2="178" stroke="#53d8fb" stroke-width="1" opacity="0.3"/>
  <!-- Z's friends (no overlap) -->
  <circle cx="630" cy="105" r="8" fill="#9b59b6" opacity="0.5"/><line x1="580" y1="130" x2="630" y2="112" stroke="#9b59b6" stroke-width="1" opacity="0.3"/>
  <circle cx="630" cy="185" r="8" fill="#9b59b6" opacity="0.5"/><line x1="580" y1="160" x2="630" y2="178" stroke="#9b59b6" stroke-width="1" opacity="0.3"/>
  <text x="520" y="222" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="11">0 mutual friends → Local Bridge</text>

  <!-- Formula -->
  <rect x="40" y="250" width="620" height="95" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="350" y="275" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Neighbourhood Overlap Formula</text>
  <text x="350" y="300" text-anchor="middle" fill="white" font-family="monospace" font-size="13">Overlap(A,B) = |common friends| / |total distinct friends of A and B|</text>
  <text x="350" y="325" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">Overlap = 0 → <tspan fill="#e94560">local bridge</tspan> (weak tie) | Overlap high → <tspan fill="#53d8fb">strong tie</tspan> (embedded) | <tspan fill="#ffcc00">Key predictor of tie strength</tspan></text>
</svg>
