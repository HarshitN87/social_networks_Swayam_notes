<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <defs>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="470" fill="#0F1117" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Markov Matrix &amp; Eigenvalue Convergence</text>
  <text x="390" y="56" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Columns sum to 1 (conservation) · Dominant eigenvalue λ₁ = 1 · All others |λᵢ| &lt; 1 → decay to zero</text>

  <!-- ================================================ -->
  <!--  LEFT: Transition Matrix M (3×3)  -->
  <!-- ================================================ -->
  <rect x="28" y="74" width="330" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="193" y="93" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Transition Matrix M for A→C, C→B, B↔A,C</text>

  <!-- Matrix bracket left -->
  <text x="48" y="215" font-family="'Segoe UI', monospace" font-size="80" fill="#64748B" text-anchor="middle">[</text>
  <!-- Matrix bracket right -->
  <text x="342" y="215" font-family="'Segoe UI', monospace" font-size="80" fill="#64748B" text-anchor="middle">]</text>

  <!-- Column headers (col A, col B, col C) -->
  <text x="130" y="116" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">col A</text>
  <text x="200" y="116" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">col B</text>
  <text x="270" y="116" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#86EFAC" text-anchor="middle">col C</text>

  <!-- Row labels -->
  <text x="75" y="158" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">row A</text>
  <text x="75" y="200" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">row B</text>
  <text x="75" y="242" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">row C</text>

  <!-- Matrix values -->
  <!-- Row 1: A, B, C -->
  <text x="130" y="158" font-family="'Segoe UI', monospace" font-size="16" fill="#E5E7EB" text-anchor="middle">0</text>
  <text x="200" y="158" font-family="'Segoe UI', monospace" font-size="16" fill="#FCD34D" text-anchor="middle">½</text>
  <text x="270" y="158" font-family="'Segoe UI', monospace" font-size="16" fill="#E5E7EB" text-anchor="middle">0</text>

  <!-- Row 2 -->
  <text x="130" y="200" font-family="'Segoe UI', monospace" font-size="16" fill="#E5E7EB" text-anchor="middle">0</text>
  <text x="200" y="200" font-family="'Segoe UI', monospace" font-size="16" fill="#E5E7EB" text-anchor="middle">0</text>
  <text x="270" y="200" font-family="'Segoe UI', monospace" font-size="16" fill="#86EFAC" text-anchor="middle">1</text>

  <!-- Row 3 -->
  <text x="130" y="242" font-family="'Segoe UI', monospace" font-size="16" fill="#93C5FD" text-anchor="middle">1</text>
  <text x="200" y="242" font-family="'Segoe UI', monospace" font-size="16" fill="#FCD34D" text-anchor="middle">½</text>
  <text x="270" y="242" font-family="'Segoe UI', monospace" font-size="16" fill="#E5E7EB" text-anchor="middle">0</text>

  <!-- Column sum indicators -->
  <line x1="100" y1="258" x2="310" y2="258" stroke="#374151" stroke-width="1.5"/>
  <text x="75" y="278" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Σ col</text>
  <text x="130" y="278" font-family="'Segoe UI', monospace" font-size="14" font-weight="700" fill="#22C55E" text-anchor="middle">= 1</text>
  <text x="200" y="278" font-family="'Segoe UI', monospace" font-size="14" font-weight="700" fill="#22C55E" text-anchor="middle">= 1</text>
  <text x="270" y="278" font-family="'Segoe UI', monospace" font-size="14" font-weight="700" fill="#22C55E" text-anchor="middle">= 1</text>

  <!-- Markov property note -->
  <rect x="40" y="295" width="310" height="40" rx="7" fill="#0D2215" stroke="#22C55E" stroke-width="1.2"/>
  <text x="195" y="312" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#4ADE80" text-anchor="middle">✓ Markov (Stochastic) Matrix</text>
  <text x="195" y="327" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86EFAC" text-anchor="middle">Every column sums to 1 → total influence conserved</text>

  <!-- Power iteration formula -->
  <rect x="40" y="348" width="310" height="60" rx="7" fill="#1A1D27" stroke="#374151" stroke-width="1.2"/>
  <text x="195" y="368" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E5E7EB" text-anchor="middle">Power Iteration</text>
  <text x="195" y="387" font-family="'Segoe UI', monospace" font-size="13" fill="#C4B5FD" text-anchor="middle">r⁽ᵏ⁾ = Mᵏ · r⁽⁰⁾</text>
  <text x="195" y="403" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Converges: M · r* = r*  (eigenvector eq.)</text>

  <!-- ================================================ -->
  <!--  RIGHT: Eigenvalue Decay Chart  -->
  <!-- ================================================ -->
  <rect x="385" y="74" width="370" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="570" y="93" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Eigenvalue Decay: λᵢᵏ vs. Iteration k</text>

  <!-- Chart area -->
  <rect x="420" y="115" width="310" height="200" rx="4" fill="#111827" stroke="#1E293B" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="408" y="218" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle" transform="rotate(-90 408 218)">λᵏ value</text>

  <!-- X-axis: grid lines and labels -->
  <line x1="420" y1="315" x2="730" y2="315" stroke="#374151" stroke-width="1"/>
  <!-- X ticks -->
  <line x1="420" y1="315" x2="420" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="420" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">0</text>
  <line x1="482" y1="315" x2="482" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="482" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">2</text>
  <line x1="544" y1="315" x2="544" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="544" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">4</text>
  <line x1="606" y1="315" x2="606" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="606" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">6</text>
  <line x1="668" y1="315" x2="668" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="668" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">8</text>
  <line x1="730" y1="315" x2="730" y2="320" stroke="#6B7280" stroke-width="1"/>
  <text x="730" y="330" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">10</text>
  <text x="570" y="345" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Iteration k →</text>

  <!-- Y-axis -->
  <line x1="420" y1="115" x2="420" y2="315" stroke="#374151" stroke-width="1"/>
  <!-- Y grid lines -->
  <line x1="420" y1="165" x2="730" y2="165" stroke="#1E293B" stroke-width="1"/>
  <text x="408" y="169" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="end">0.75</text>
  <line x1="420" y1="215" x2="730" y2="215" stroke="#1E293B" stroke-width="1"/>
  <text x="408" y="219" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="end">0.50</text>
  <line x1="420" y1="265" x2="730" y2="265" stroke="#1E293B" stroke-width="1"/>
  <text x="408" y="269" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="end">0.25</text>
  <text x="408" y="319" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="end">0.00</text>
  <text x="408" y="120" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6B7280" text-anchor="end">1.00</text>

  <!-- λ₁=1 line (flat, dominant) -->
  <line x1="420" y1="115" x2="730" y2="115" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="735" y="119" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#4ADE80">λ₁=1</text>

  <!-- λ₂ = 0.7 decay curve (approx polyline) -->
  <!-- k=0: 1.0 (y=115), k=2: 0.49 (y=215-(0.49*200)=115), computed: 115 + (1-0.7^k)*200 -->
  <!-- y = 115 + (1 - λ^k) * 200  for λ=0.7 -->
  <!-- k=0: y=115, k=1: y=115+60=175, k=2: y=115+102=217, k=3: y=115+127=242, k=4: y=115+144=259, k=6: y=115+165=280, k=8: y=115+176=291, k=10: y=115+183=298 -->
  <polyline points="420,115 451,175 482,217 513,242 544,259 575,268 606,278 637,285 668,291 699,295 730,298" stroke="#F59E0B" stroke-width="2.2" fill="none"/>
  <text x="655" y="310" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FCD34D">λ₂ ≈ 0.7</text>

  <!-- λ₃ = 0.4 decay (faster) -->
  <!-- y = 115 + (1 - 0.4^k)*200 -->
  <!-- k=0: y=115, k=1: y=115+120=235, k=2: y=115+168=283, k=3: y=115+187=302, k=4,5...: ≈310,313,... -->
  <polyline points="420,115 451,235 482,283 513,302 544,308 575,311 606,313 637,314 668,314 699,315 730,315" stroke="#A78BFA" stroke-width="2.2" fill="none"/>
  <text x="480" y="250" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">λ₃ ≈ 0.4 →0</text>

  <!-- Legend -->
  <rect x="430" y="125" width="130" height="56" rx="5" fill="#1A1D27" stroke="#374151" stroke-width="1"/>
  <line x1="438" y1="140" x2="462" y2="140" stroke="#22C55E" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="468" y="144" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E5E7EB">λ₁=1 (dominant)</text>
  <line x1="438" y1="158" x2="462" y2="158" stroke="#F59E0B" stroke-width="2"/>
  <text x="468" y="162" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E5E7EB">|λ₂| &lt; 1 (decay)</text>
  <line x1="438" y1="174" x2="462" y2="174" stroke="#A78BFA" stroke-width="2"/>
  <text x="468" y="178" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E5E7EB">|λ₃| &lt; 1 (fast decay)</text>

  <!-- ================================================ -->
  <!--  BOTTOM: Convergence proof summary -->
  <!-- ================================================ -->
  <rect x="385" y="360" width="370" height="90" rx="8" fill="#1A1D27" stroke="#374151" stroke-width="1.2"/>
  <text x="570" y="380" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="middle">Mathematical Convergence Proof</text>
  <text x="395" y="400" font-family="'Segoe UI', monospace" font-size="10.5" fill="#C4B5FD">r⁽⁰⁾ = c₁v₁ + c₂v₂ + ... + cₙvₙ</text>
  <text x="395" y="416" font-family="'Segoe UI', monospace" font-size="10.5" fill="#FCD34D">Mᵏ r⁽⁰⁾ = c₁(1)ᵏv₁ + c₂λ₂ᵏv₂ + ... + cₙλₙᵏvₙ</text>
  <text x="395" y="432" font-family="'Segoe UI', monospace" font-size="10.5" fill="#4ADE80">k→∞: Mᵏ r⁽⁰⁾  →  c₁v₁   (PageRank vector)</text>
  <text x="395" y="447" font-family="'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF">Since |λᵢ|&lt;1 for i&gt;1, all sub-dominant terms vanish → only principal eigenvector remains</text>
</svg>
