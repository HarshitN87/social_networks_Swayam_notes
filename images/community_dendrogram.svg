<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg5)" rx="12"/>
  <text x="400" y="30" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Dendrogram — Hierarchy of Community Splits</text>

  <!-- Leaf nodes at bottom -->
  <circle cx="100" cy="350" r="12" fill="#6366f1" filter="url(#glow5)"/>
  <text x="100" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">A</text>
  <circle cx="180" cy="350" r="12" fill="#6366f1" filter="url(#glow5)"/>
  <text x="180" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B</text>
  <circle cx="260" cy="350" r="12" fill="#6366f1" filter="url(#glow5)"/>
  <text x="260" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">C</text>

  <circle cx="380" cy="350" r="12" fill="#ec4899" filter="url(#glow5)"/>
  <text x="380" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">D</text>
  <circle cx="460" cy="350" r="12" fill="#ec4899" filter="url(#glow5)"/>
  <text x="460" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">E</text>

  <circle cx="580" cy="350" r="12" fill="#10b981" filter="url(#glow5)"/>
  <text x="580" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">F</text>
  <circle cx="660" cy="350" r="12" fill="#10b981" filter="url(#glow5)"/>
  <text x="660" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">G</text>
  <circle cx="740" cy="350" r="12" fill="#10b981" filter="url(#glow5)"/>
  <text x="740" y="354" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">H</text>

  <!-- Level 1 merges (closest pairs) -->
  <!-- A-B merge -->
  <line x1="100" y1="338" x2="100" y2="290" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="180" y1="338" x2="180" y2="290" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="100" y1="290" x2="180" y2="290" stroke="#818cf8" stroke-width="1.5"/>
  <!-- D-E merge -->
  <line x1="380" y1="338" x2="380" y2="290" stroke="#f472b6" stroke-width="1.5"/>
  <line x1="460" y1="338" x2="460" y2="290" stroke="#f472b6" stroke-width="1.5"/>
  <line x1="380" y1="290" x2="460" y2="290" stroke="#f472b6" stroke-width="1.5"/>
  <!-- F-G merge -->
  <line x1="580" y1="338" x2="580" y2="300" stroke="#34d399" stroke-width="1.5"/>
  <line x1="660" y1="338" x2="660" y2="300" stroke="#34d399" stroke-width="1.5"/>
  <line x1="580" y1="300" x2="660" y2="300" stroke="#34d399" stroke-width="1.5"/>

  <!-- Level 2 merges -->
  <!-- AB + C merge -->
  <line x1="140" y1="290" x2="140" y2="220" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="260" y1="338" x2="260" y2="220" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="140" y1="220" x2="260" y2="220" stroke="#818cf8" stroke-width="1.5"/>
  <!-- FG + H merge -->
  <line x1="620" y1="300" x2="620" y2="230" stroke="#34d399" stroke-width="1.5"/>
  <line x1="740" y1="338" x2="740" y2="230" stroke="#34d399" stroke-width="1.5"/>
  <line x1="620" y1="230" x2="740" y2="230" stroke="#34d399" stroke-width="1.5"/>

  <!-- Level 3 merges -->
  <!-- ABC + DE merge -->
  <line x1="200" y1="220" x2="200" y2="140" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="420" y1="290" x2="420" y2="140" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="420" y2="140" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- Level 4: Final merge (all) -->
  <line x1="310" y1="140" x2="310" y2="70" stroke="#fbbf24" stroke-width="2"/>
  <line x1="680" y1="230" x2="680" y2="70" stroke="#fbbf24" stroke-width="2"/>
  <line x1="310" y1="70" x2="680" y2="70" stroke="#fbbf24" stroke-width="2"/>

  <!-- Cut lines -->
  <line x1="40" y1="160" x2="770" y2="160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="48" y="152" fill="#ef4444" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Cut here → 3 communities</text>

  <line x1="40" y1="260" x2="770" y2="260" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="48" y="252" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11">Cut here → 5 communities</text>

  <!-- Y-axis label -->
  <text x="25" y="200" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90, 25, 200)">Edge Betweenness at Removal ↑</text>
</svg>
