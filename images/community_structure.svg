<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg1)" rx="12"/>
  <text x="400" y="35" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Community Structure — Dense Internal, Sparse External</text>

  <!-- Community A (left cluster) -->
  <ellipse cx="220" cy="210" rx="140" ry="130" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="220" y="360" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Community A</text>

  <!-- Community A nodes -->
  <circle cx="170" cy="160" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="170" y="165" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">A</text>
  <circle cx="260" cy="150" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="260" y="155" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">B</text>
  <circle cx="190" cy="230" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="190" y="235" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">C</text>
  <circle cx="270" cy="240" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="270" y="245" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">D</text>
  <circle cx="150" cy="280" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="150" y="285" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">E</text>
  <circle cx="240" cy="300" r="14" fill="#6366f1" filter="url(#glow1)"/>
  <text x="240" y="305" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">F</text>

  <!-- Community A internal edges (many) -->
  <line x1="170" y1="160" x2="260" y2="150" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="170" y1="160" x2="190" y2="230" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="170" y1="160" x2="150" y2="280" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="260" y1="150" x2="270" y2="240" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="260" y1="150" x2="190" y2="230" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="190" y1="230" x2="270" y2="240" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="190" y1="230" x2="150" y2="280" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="190" y1="230" x2="240" y2="300" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="270" y1="240" x2="240" y2="300" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="280" x2="240" y2="300" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>

  <!-- Community B (right cluster) -->
  <ellipse cx="580" cy="210" rx="140" ry="130" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="580" y="360" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Community B</text>

  <!-- Community B nodes -->
  <circle cx="530" cy="150" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="530" y="155" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">G</text>
  <circle cx="620" cy="160" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="620" y="165" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">H</text>
  <circle cx="560" cy="230" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="560" y="235" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">I</text>
  <circle cx="650" cy="240" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="650" y="245" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">J</text>
  <circle cx="540" cy="300" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="540" y="305" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">K</text>
  <circle cx="630" cy="290" r="14" fill="#ec4899" filter="url(#glow1)"/>
  <text x="630" y="295" fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">L</text>

  <!-- Community B internal edges (many) -->
  <line x1="530" y1="150" x2="620" y2="160" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="530" y1="150" x2="560" y2="230" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="620" y1="160" x2="650" y2="240" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="620" y1="160" x2="560" y2="230" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="560" y1="230" x2="650" y2="240" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="560" y1="230" x2="540" y2="300" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="650" y1="240" x2="630" y2="290" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="540" y1="300" x2="630" y2="290" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="530" y1="150" x2="540" y2="300" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="650" y1="240" x2="540" y2="300" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>

  <!-- Inter-community edges (few, highlighted) -->
  <line x1="270" y1="240" x2="530" y2="150" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.9"/>
  <line x1="240" y1="300" x2="540" y2="300" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.9"/>

  <!-- Legend -->
  <rect x="310" y="60" width="180" height="95" fill="rgba(0,0,0,0.4)" rx="8"/>
  <line x1="325" y1="82" x2="355" y2="82" stroke="#818cf8" stroke-width="2"/>
  <text x="365" y="86" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="11">Intra-community (many)</text>
  <line x1="325" y1="105" x2="355" y2="105" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="365" y="109" fill="#fde68a" font-family="Arial, sans-serif" font-size="11">Inter-community (few)</text>
  <text x="400" y="140" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">10 internal + 10 internal</text>
  <text x="400" y="152" fill="#fbbf24" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Only 2 bridging edges</text>
</svg>
