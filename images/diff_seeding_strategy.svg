<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="380" fill="url(#bg3)" rx="12"/>
  <text x="360" y="32" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Seeding Strategies — Who to Target First</text>
  
  <!-- Strategy 1: Random -->
  <rect x="25" y="55" width="210" height="300" fill="rgba(255,255,255,0.04)" rx="10"/>
  <text x="130" y="80" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Random Seeding</text>
  <!-- Random seed node -->
  <circle cx="130" cy="140" r="10" fill="#888" opacity="0.7"/>
  <circle cx="80" cy="120" r="8" fill="#555"/><line x1="130" y1="140" x2="80" y2="120" stroke="#555" stroke-width="1"/>
  <circle cx="170" cy="110" r="8" fill="#555"/><line x1="130" y1="140" x2="170" y2="110" stroke="#555" stroke-width="1"/>
  <circle cx="100" cy="180" r="8" fill="#555"/><line x1="130" y1="140" x2="100" y2="180" stroke="#555" stroke-width="1"/>
  <circle cx="160" cy="175" r="8" fill="#555"/><line x1="130" y1="140" x2="160" y2="175" stroke="#555" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="11">No targeting</text>
  <text x="130" y="236" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="11">Depends on luck</text>
  <rect x="45" y="260" width="170" height="35" rx="6" fill="rgba(136,136,136,0.15)"/>
  <text x="130" y="275" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="11">Result: Unpredictable</text>
  <text x="130" y="290" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="10">Usually small cascade</text>
  <text x="130" y="335" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="22">❌</text>

  <!-- Strategy 2: High-Degree -->
  <rect x="255" y="55" width="210" height="300" fill="rgba(83,216,251,0.04)" rx="10"/>
  <text x="360" y="80" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Influencer Seeding</text>
  <!-- Hub node -->
  <circle cx="360" cy="135" r="14" fill="#53d8fb" opacity="0.9"/>
  <circle cx="310" cy="105" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="310" y2="105" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="340" cy="95" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="340" y2="95" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="380" cy="95" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="380" y2="95" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="410" cy="105" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="410" y2="105" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="310" cy="155" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="310" y2="155" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="410" cy="155" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="410" y2="155" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="330" cy="175" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="330" y2="175" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <circle cx="390" cy="175" r="7" fill="#53d8fb" opacity="0.5"/><line x1="360" y1="135" x2="390" y2="175" stroke="#53d8fb" stroke-width="1" opacity="0.5"/>
  <text x="360" y="210" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="11">Target high-degree nodes</text>
  <text x="360" y="226" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="11">Max immediate reach</text>
  <rect x="275" y="260" width="170" height="35" rx="6" fill="rgba(83,216,251,0.15)"/>
  <text x="360" y="275" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="11">Result: Good initial burst</text>
  <text x="360" y="290" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="10">May lack sustained spread</text>
  <text x="360" y="335" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="22">⚠️</text>

  <!-- Strategy 3: Bridging + Hub -->
  <rect x="485" y="55" width="210" height="300" fill="rgba(46,204,113,0.04)" rx="10"/>
  <text x="590" y="80" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Optimal Seeding</text>
  <!-- Bridge user connecting clusters -->
  <circle cx="590" cy="135" r="12" fill="#2ecc71" opacity="0.9"/>
  <!-- Cluster 1 -->
  <circle cx="540" cy="105" r="8" fill="#2ecc71" opacity="0.6"/><line x1="590" y1="135" x2="540" y2="105" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <circle cx="520" cy="130" r="8" fill="#2ecc71" opacity="0.6"/><line x1="590" y1="135" x2="520" y2="130" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <circle cx="540" cy="155" r="8" fill="#2ecc71" opacity="0.6"/><line x1="590" y1="135" x2="540" y2="155" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="540" y1="105" x2="520" y2="130" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="130" x2="540" y2="155" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <!-- Cluster 2 -->
  <circle cx="640" cy="105" r="8" fill="#e94560" opacity="0.6"/><line x1="590" y1="135" x2="640" y2="105" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <circle cx="660" cy="130" r="8" fill="#e94560" opacity="0.6"/><line x1="590" y1="135" x2="660" y2="130" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <circle cx="640" cy="155" r="8" fill="#e94560" opacity="0.6"/><line x1="590" y1="135" x2="640" y2="155" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
  <line x1="640" y1="105" x2="660" y2="130" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <line x1="660" y1="130" x2="640" y2="155" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <text x="590" y="200" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">Target bridges + hubs</text>
  <text x="590" y="216" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">across multiple clusters</text>
  <rect x="505" y="260" width="170" height="35" rx="6" fill="rgba(46,204,113,0.15)"/>
  <text x="590" y="275" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">Result: Cross-cluster</text>
  <text x="590" y="290" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">Maximum sustained spread</text>
  <text x="590" y="335" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="22">✓</text>
</svg>
