<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" fill="url(#bg3)" rx="12"/>
  <text x="360" y="30" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Clustering Coefficient — How Much Do Your Friends Know Each Other?</text>

  <!-- High clustering -->
  <rect x="30" y="50" width="310" height="220" fill="rgba(46,204,113,0.06)" rx="10"/>
  <text x="185" y="75" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="13" font-weight="bold">High Clustering (C = 1.0)</text>
  <text x="185" y="92" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">All friends know each other</text>

  <!-- Center node -->
  <circle cx="185" cy="155" r="18" fill="#ffcc00" opacity="0.9"/><text x="185" y="160" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">You</text>
  <!-- Friends -->
  <circle cx="115" cy="120" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="255" cy="120" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="115" cy="200" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="255" cy="200" r="12" fill="#2ecc71" opacity="0.7"/>
  <!-- Edges to friends -->
  <line x1="185" y1="155" x2="115" y2="120" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="185" y1="155" x2="255" y2="120" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="185" y1="155" x2="115" y2="200" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="185" y1="155" x2="255" y2="200" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <!-- All friend-friend edges -->
  <line x1="115" y1="120" x2="255" y2="120" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="120" x2="115" y2="200" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="120" x2="255" y2="200" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="255" y1="120" x2="115" y2="200" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="255" y1="120" x2="255" y2="200" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="200" x2="255" y2="200" stroke="#2ecc71" stroke-width="1.5" opacity="0.5"/>
  <text x="185" y="240" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="11">6/6 possible edges exist</text>
  <text x="185" y="258" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">Redundant info, deep trust</text>

  <!-- Low clustering -->
  <rect x="380" y="50" width="310" height="220" fill="rgba(233,69,96,0.06)" rx="10"/>
  <text x="535" y="75" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Low Clustering (C = 0)</text>
  <text x="535" y="92" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="11">No friends know each other</text>

  <!-- Center node -->
  <circle cx="535" cy="155" r="18" fill="#ffcc00" opacity="0.9"/><text x="535" y="160" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">You</text>
  <!-- Friends -->
  <circle cx="430" cy="105" r="12" fill="#e94560" opacity="0.7"/>
  <circle cx="640" cy="105" r="12" fill="#53d8fb" opacity="0.7"/>
  <circle cx="430" cy="215" r="12" fill="#2ecc71" opacity="0.7"/>
  <circle cx="640" cy="215" r="12" fill="#9b59b6" opacity="0.7"/>
  <!-- Edges to friends only -->
  <line x1="535" y1="155" x2="430" y2="105" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="535" y1="155" x2="640" y2="105" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="535" y1="155" x2="430" y2="215" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <line x1="535" y1="155" x2="640" y2="215" stroke="#ffcc00" stroke-width="2" opacity="0.6"/>
  <!-- No friend-friend edges -->
  <text x="535" y="240" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="11">0/6 possible edges exist</text>
  <text x="535" y="258" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">Diverse info, structural hole</text>

  <!-- Formula bar -->
  <rect x="40" y="290" width="640" height="95" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="360" y="315" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Clustering Coefficient Formula</text>
  <text x="360" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="13">C(v) = edges among neighbours / C(k,2) = edges among neighbours / [k(k−1)/2]</text>
  <text x="360" y="365" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">High C → deep inside community | Low C → bridge between communities | C is <tspan fill="#e94560">inversely related</tspan> to novel info access</text>
</svg>
