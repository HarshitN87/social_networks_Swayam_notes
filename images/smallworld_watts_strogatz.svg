<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="850" height="500" fill="url(#bg2)" rx="12"/>
  <text x="425" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Watts-Strogatz Model — From Regular Lattice to Small World</text>

  <!-- Stage 1: Regular Lattice (p=0) -->
  <text x="145" y="70" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13" font-weight="bold">p = 0 (Regular)</text>
  <!-- Ring of nodes -->
  <circle cx="145" cy="200" r="80" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Nodes on ring -->
  <circle cx="145" cy="120" r="8" fill="#6366f1" filter="url(#glow2)"/>
  <circle cx="214" cy="145" r="8" fill="#6366f1"/>
  <circle cx="225" cy="200" r="8" fill="#6366f1"/>
  <circle cx="214" cy="255" r="8" fill="#6366f1"/>
  <circle cx="145" cy="280" r="8" fill="#6366f1"/>
  <circle cx="76" cy="255" r="8" fill="#6366f1"/>
  <circle cx="65" cy="200" r="8" fill="#6366f1"/>
  <circle cx="76" cy="145" r="8" fill="#6366f1"/>
  <!-- Local edges only -->
  <line x1="145" y1="120" x2="214" y2="145" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="214" y1="145" x2="225" y2="200" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="225" y1="200" x2="214" y2="255" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="214" y1="255" x2="145" y2="280" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="145" y1="280" x2="76" y2="255" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="76" y1="255" x2="65" y2="200" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="65" y1="200" x2="76" y2="145" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="76" y1="145" x2="145" y2="120" stroke="#818cf8" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="145" y="320" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">High clustering</text>
  <text x="145" y="335" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">Long path lengths ✗</text>

  <!-- Arrow 1 -->
  <text x="305" y="200" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="28">→</text>
  <text x="305" y="220" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">Rewire</text>

  <!-- Stage 2: Small World (p ≈ 0.01) -->
  <text x="425" y="70" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="13" font-weight="bold">p ≈ 0.01 (Small World)</text>
  <circle cx="425" cy="200" r="80" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Nodes -->
  <circle cx="425" cy="120" r="8" fill="#22c55e" filter="url(#glow2)"/>
  <circle cx="494" cy="145" r="8" fill="#22c55e"/>
  <circle cx="505" cy="200" r="8" fill="#22c55e"/>
  <circle cx="494" cy="255" r="8" fill="#22c55e"/>
  <circle cx="425" cy="280" r="8" fill="#22c55e"/>
  <circle cx="356" cy="255" r="8" fill="#22c55e"/>
  <circle cx="345" cy="200" r="8" fill="#22c55e"/>
  <circle cx="356" cy="145" r="8" fill="#22c55e"/>
  <!-- Local edges -->
  <line x1="425" y1="120" x2="494" y2="145" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="494" y1="145" x2="505" y2="200" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="505" y1="200" x2="494" y2="255" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="494" y1="255" x2="425" y2="280" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="425" y1="280" x2="356" y2="255" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="356" y1="255" x2="345" y2="200" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="345" y1="200" x2="356" y2="145" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="356" y1="145" x2="425" y2="120" stroke="#4ade80" stroke-width="1.5"/>
  <!-- Rewired shortcut edges -->
  <line x1="425" y1="120" x2="425" y2="280" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="356" y1="145" x2="505" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Labels -->
  <text x="425" y="320" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">High clustering ✓</text>
  <text x="425" y="335" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10">Short path lengths ✓</text>
  <text x="425" y="355" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">— — Shortcuts (rewired)</text>

  <!-- Arrow 2 -->
  <text x="585" y="200" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="28">→</text>
  <text x="585" y="220" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">More rewiring</text>

  <!-- Stage 3: Random (p=1) -->
  <text x="710" y="70" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13" font-weight="bold">p = 1 (Random)</text>
  <circle cx="710" cy="200" r="80" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Nodes -->
  <circle cx="710" cy="120" r="8" fill="#ef4444"/>
  <circle cx="779" cy="145" r="8" fill="#ef4444"/>
  <circle cx="790" cy="200" r="8" fill="#ef4444"/>
  <circle cx="779" cy="255" r="8" fill="#ef4444"/>
  <circle cx="710" cy="280" r="8" fill="#ef4444"/>
  <circle cx="641" cy="255" r="8" fill="#ef4444"/>
  <circle cx="630" cy="200" r="8" fill="#ef4444"/>
  <circle cx="641" cy="145" r="8" fill="#ef4444"/>
  <!-- Random edges -->
  <line x1="710" y1="120" x2="779" y2="255" stroke="#f87171" stroke-width="1.5"/>
  <line x1="779" y1="145" x2="641" y2="255" stroke="#f87171" stroke-width="1.5"/>
  <line x1="790" y1="200" x2="641" y2="145" stroke="#f87171" stroke-width="1.5"/>
  <line x1="710" y1="280" x2="710" y2="120" stroke="#f87171" stroke-width="1.5"/>
  <line x1="630" y1="200" x2="779" y2="145" stroke="#f87171" stroke-width="1.5"/>
  <line x1="641" y1="145" x2="779" y2="255" stroke="#f87171" stroke-width="1.5"/>
  <line x1="641" y1="255" x2="790" y2="200" stroke="#f87171" stroke-width="1.5"/>
  <line x1="710" y1="280" x2="630" y2="200" stroke="#f87171" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="710" y="320" text-anchor="middle" fill="#ef4444" font-family="Arial,sans-serif" font-size="10">Low clustering ✗</text>
  <text x="710" y="335" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Short path lengths ✓</text>

  <!-- Summary Box -->
  <rect x="100" y="380" width="650" height="95" rx="8" fill="#1e1b4b" opacity="0.7" stroke="#6366f1" stroke-width="1"/>
  <text x="425" y="405" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="13" font-weight="bold">The Sweet Spot: Small-World Networks</text>
  <text x="425" y="425" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11">• Regular lattice: High clustering, but very long paths (not small world)</text>
  <text x="425" y="445" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="11">• Even 1% rewiring creates shortcuts → drastically reduces average path length</text>
  <text x="425" y="465" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11">• Clustering stays high while path length plummets → SMALL WORLD</text>
</svg>
