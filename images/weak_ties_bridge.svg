<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" aria-labelledby="title desc">
  <title id="title">The Strength of Weak Ties: Social Network Clusters</title>
  <desc id="desc">A diagram showing two dense clusters of strong ties connected by a single weak tie bridge, illustrating Granovetter's theory.</desc>
  
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="450" fill="url(#bg_gradient)" rx="16"/>
  
  <text x="360" y="35" text-anchor="middle" fill="#f43f5e" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    THE STRENGTH OF WEAK TIES
  </text>
  <text x="360" y="55" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400">
    Granovetter's Theory: Weak Ties as Information Bridges
  </text>

  <g id="cluster_a">
    <ellipse cx="180" cy="220" rx="130" ry="120" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="180" y="90" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Cluster A: High Density</text>
    
    <g stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.5">
      <line x1="130" y1="180" x2="200" y2="160"/>
      <line x1="200" y1="160" x2="240" y2="210"/>
      <line x1="130" y1="180" x2="160" y2="240"/>
      <line x1="130" y1="180" x2="240" y2="210"/>
      <line x1="160" y1="240" x2="120" y2="280"/>
      <line x1="160" y1="240" x2="210" y2="280"/>
      <line x1="120" y1="280" x2="210" y2="280"/>
      <line x1="200" y1="160" x2="160" y2="240"/>
      <line x1="240" y1="210" x2="210" y2="280"/>
      <line x1="240" y1="210" x2="160" y2="240"/>
    </g>

    <g fill="#38bdf8" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      <circle cx="130" cy="180" r="15"/><text x="130" y="184" fill="#0f172a">A1</text>
      <circle cx="200" cy="160" r="15"/><text x="200" y="164" fill="#0f172a">A2</text>
      <circle cx="240" cy="210" r="15" filter="url(#glow)"/><text x="240" y="214" fill="#0f172a">A3</text>
      <circle cx="160" cy="240" r="15"/><text x="160" y="244" fill="#0f172a">A4</text>
      <circle cx="120" cy="280" r="15"/><text x="120" y="284" fill="#0f172a">A5</text>
      <circle cx="210" cy="280" r="15"/><text x="210" y="284" fill="#0f172a">A6</text>
    </g>
  </g>

  <g id="cluster_b">
    <ellipse cx="540" cy="220" rx="130" ry="120" fill="rgba(244,63,94,0.05)" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="540" y="90" text-anchor="middle" fill="#f43f5e" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Cluster B: Distant Network</text>
    
    <g stroke="#f43f5e" stroke-width="3.5" stroke-opacity="0.5">
      <line x1="480" y1="180" x2="540" y2="160"/>
      <line x1="540" y1="160" x2="600" y2="190"/>
      <line x1="480" y1="180" x2="510" y2="240"/>
      <line x1="510" y1="240" x2="570" y2="270"/>
      <line x1="570" y1="270" x2="620" y2="280"/>
      <line x1="600" y1="190" x2="620" y2="280"/>
      <line x1="540" y1="160" x2="510" y2="240"/>
      <line x1="600" y1="190" x2="570" y2="270"/>
      <line x1="480" y1="180" x2="600" y2="190"/>
      <line x1="510" y1="240" x2="620" y2="280"/>
    </g>

    <g fill="#f43f5e" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      <circle cx="480" cy="180" r="15" filter="url(#glow)"/><text x="480" y="184" fill="#0f172a">B1</text>
      <circle cx="540" cy="160" r="15"/><text x="540" y="164" fill="#0f172a">B2</text>
      <circle cx="600" cy="190" r="15"/><text x="600" y="194" fill="#0f172a">B3</text>
      <circle cx="510" cy="240" r="15"/><text x="510" y="244" fill="#0f172a">B4</text>
      <circle cx="570" cy="270" r="15"/><text x="570" y="274" fill="#0f172a">B5</text>
      <circle cx="620" cy="280" r="15"/><text x="620" y="284" fill="#0f172a">B6</text>
    </g>
  </g>

  <g id="bridge">
    <line x1="240" y1="210" x2="480" y2="180" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="315" y="175" width="90" height="20" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
    <text x="360" y="189" text-anchor="middle" fill="#facc15" font-family="Arial,sans-serif" font-size="12" font-weight="bold">WEAK TIE</text>
    <text x="360" y="210" text-anchor="middle" fill="#facc15" font-family="Arial,sans-serif" font-size="10" font-style="italic">Local Bridge</text>
  </g>

  <g transform="translate(40, 370)">
    <rect width="640" height="60" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.1)"/>
    <text x="320" y="25" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">
      Strong ties (solid, thick) represent <tspan fill="#38bdf8" font-weight="bold">redundant</tspan> information within groups.
    </text>
    <text x="320" y="45" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">
      Weak ties (dashed, thin) act as <tspan fill="#facc15" font-weight="bold">bridges</tspan> providing access to novel information.
    </text>
  </g>
</svg>
