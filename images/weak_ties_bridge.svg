<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" fill="url(#bg1)" rx="12"/>
  <text x="360" y="32" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Weak Ties as Bridges Between Clusters</text>

  <!-- Cluster A -->
  <ellipse cx="180" cy="200" rx="140" ry="130" fill="rgba(83,216,251,0.08)" stroke="#53d8fb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="180" y="80" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Cluster A (Close Friends)</text>
  <circle cx="130" cy="160" r="14" fill="#53d8fb" opacity="0.85"/><text x="130" y="164" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₁</text>
  <circle cx="200" cy="140" r="14" fill="#53d8fb" opacity="0.85"/><text x="200" y="144" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₂</text>
  <circle cx="240" cy="190" r="14" fill="#53d8fb" opacity="0.85"/><text x="240" y="194" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₃</text>
  <circle cx="160" cy="220" r="14" fill="#53d8fb" opacity="0.85"/><text x="160" y="224" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₄</text>
  <circle cx="120" cy="260" r="14" fill="#53d8fb" opacity="0.85"/><text x="120" y="264" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₅</text>
  <circle cx="210" cy="260" r="14" fill="#53d8fb" opacity="0.85"/><text x="210" y="264" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">A₆</text>
  <!-- Dense internal edges cluster A -->
  <line x1="130" y1="160" x2="200" y2="140" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="140" x2="240" y2="190" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="160" x2="160" y2="220" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="160" x2="240" y2="190" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="160" y1="220" x2="120" y2="260" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="160" y1="220" x2="210" y2="260" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="260" x2="210" y2="260" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="140" x2="160" y2="220" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="190" x2="210" y2="260" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="190" x2="160" y2="220" stroke="#53d8fb" stroke-width="2" opacity="0.4"/>

  <!-- Cluster B -->
  <ellipse cx="540" cy="200" rx="140" ry="130" fill="rgba(233,69,96,0.08)" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="80" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Cluster B (Distant Group)</text>
  <circle cx="480" cy="160" r="14" fill="#e94560" opacity="0.85"/><text x="480" y="164" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₁</text>
  <circle cx="540" cy="140" r="14" fill="#e94560" opacity="0.85"/><text x="540" y="144" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₂</text>
  <circle cx="600" cy="170" r="14" fill="#e94560" opacity="0.85"/><text x="600" y="174" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₃</text>
  <circle cx="510" cy="220" r="14" fill="#e94560" opacity="0.85"/><text x="510" y="224" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₄</text>
  <circle cx="570" cy="250" r="14" fill="#e94560" opacity="0.85"/><text x="570" y="254" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₅</text>
  <circle cx="620" cy="260" r="14" fill="#e94560" opacity="0.85"/><text x="620" y="264" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="10">B₆</text>
  <!-- Dense internal edges cluster B -->
  <line x1="480" y1="160" x2="540" y2="140" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="540" y1="140" x2="600" y2="170" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="480" y1="160" x2="510" y2="220" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="510" y1="220" x2="570" y2="250" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="570" y1="250" x2="620" y2="260" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="170" x2="620" y2="260" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="540" y1="140" x2="510" y2="220" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="170" x2="570" y2="250" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="480" y1="160" x2="600" y2="170" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="510" y1="220" x2="620" y2="260" stroke="#e94560" stroke-width="2" opacity="0.4"/>

  <!-- WEAK TIE BRIDGE -->
  <line x1="240" y1="190" x2="480" y2="160" stroke="#ffcc00" stroke-width="3" stroke-dasharray="8,4" opacity="0.9"/>
  <text x="360" y="160" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="13" font-weight="bold">WEAK TIE</text>
  <text x="360" y="176" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="11">(Local Bridge)</text>

  <!-- Bottom insight -->
  <rect x="40" y="340" width="640" height="45" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="360" y="362" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">Strong ties (thick lines) carry trust & redundant info | Weak tie (dashed) carries <tspan fill="#ffcc00" font-weight="bold">novel information</tspan></text>
  <text x="360" y="378" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="11">Overlap(A₃, B₁) = 0  →  This is a <tspan fill="#ffcc00">local bridge</tspan></text>
</svg>
