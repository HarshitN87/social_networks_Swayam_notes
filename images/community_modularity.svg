<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="440" fill="url(#bg4)" rx="12"/>
  <text x="400" y="35" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Modularity — Measuring Community Quality</text>

  <!-- Good partition (left) -->
  <text x="200" y="65" fill="#10b981" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓ Good Partition (High Q)</text>

  <!-- Left community -->
  <ellipse cx="130" cy="150" rx="70" ry="60" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="100" cy="130" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="150" cy="120" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="115" cy="175" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="155" cy="170" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <line x1="100" y1="130" x2="150" y2="120" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="130" x2="115" y2="175" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="120" x2="155" y2="170" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="115" y1="175" x2="155" y2="170" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="130" x2="155" y2="170" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>

  <!-- Right community -->
  <ellipse cx="280" cy="150" rx="70" ry="60" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="250" cy="130" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="300" cy="120" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="265" cy="175" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="305" cy="170" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <line x1="250" y1="130" x2="300" y2="120" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="250" y1="130" x2="265" y2="175" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="300" y1="120" x2="305" y2="170" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="265" y1="175" x2="305" y2="170" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="250" y1="130" x2="305" y2="170" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>

  <!-- One inter-community edge -->
  <line x1="155" y1="170" x2="250" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="200" y="218" fill="#10b981" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Q ≈ 0.45 (strong)</text>

  <!-- Bad partition (right) -->
  <text x="600" y="65" fill="#ef4444" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✗ Bad Partition (Low Q)</text>

  <!-- Left "community" — poorly split -->
  <ellipse cx="530" cy="150" rx="70" ry="60" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="505" cy="130" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="555" cy="120" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="515" cy="175" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="555" cy="170" r="10" fill="#ec4899" filter="url(#glow4)"/>

  <!-- Right "community" — mixed -->
  <ellipse cx="680" cy="150" rx="70" ry="60" fill="rgba(236,72,153,0.12)" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="650" cy="130" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="700" cy="120" r="10" fill="#6366f1" filter="url(#glow4)"/>
  <circle cx="665" cy="175" r="10" fill="#ec4899" filter="url(#glow4)"/>
  <circle cx="705" cy="170" r="10" fill="#6366f1" filter="url(#glow4)"/>

  <!-- Many inter-community edges -->
  <line x1="505" y1="130" x2="650" y2="130" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="555" y1="120" x2="700" y2="120" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="515" y1="175" x2="665" y2="175" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="555" y1="170" x2="705" y2="170" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="555" y1="120" x2="665" y2="175" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <text x="600" y="218" fill="#ef4444" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Q ≈ 0.02 (terrible)</text>

  <!-- Modularity Formula Box -->
  <rect x="50" y="250" width="700" height="170" fill="rgba(0,0,0,0.4)" rx="10"/>
  <text x="400" y="280" fill="#fbbf24" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Modularity Formula</text>

  <text x="400" y="310" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Q = Σ [ (fraction of edges within community s) − (expected fraction if random) ]</text>
  <text x="400" y="340" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Q = Σₛ [ eₛₛ − aₛ² ]    where  eₛₛ = intra-community edge fraction,  aₛ = degree fraction</text>

  <text x="400" y="372" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Q = 0 → partition is no better than random     |     Q → 1 → very strong community structure</text>
  <text x="400" y="395" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">In practice, Q > 0.3 indicates significant community structure</text>
  <text x="400" y="415" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Modularity compares actual internal edges to what you'd EXPECT by chance in a random graph with the same degree sequence</text>
</svg>
