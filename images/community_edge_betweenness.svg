<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)" rx="12"/>
  <text x="400" y="35" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Edge Betweenness — Shortest Paths Through Each Edge</text>

  <!-- Left cluster -->
  <circle cx="120" cy="180" r="16" fill="#6366f1" filter="url(#glow2)"/>
  <text x="120" y="185" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">1</text>
  <circle cx="200" cy="130" r="16" fill="#6366f1" filter="url(#glow2)"/>
  <text x="200" y="135" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">2</text>
  <circle cx="200" cy="230" r="16" fill="#6366f1" filter="url(#glow2)"/>
  <text x="200" y="235" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">3</text>
  <circle cx="300" cy="180" r="16" fill="#6366f1" filter="url(#glow2)"/>
  <text x="300" y="185" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">4</text>

  <!-- Right cluster -->
  <circle cx="500" cy="180" r="16" fill="#ec4899" filter="url(#glow2)"/>
  <text x="500" y="185" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">5</text>
  <circle cx="600" cy="130" r="16" fill="#ec4899" filter="url(#glow2)"/>
  <text x="600" y="135" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">6</text>
  <circle cx="600" cy="230" r="16" fill="#ec4899" filter="url(#glow2)"/>
  <text x="600" y="235" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">7</text>
  <circle cx="680" cy="180" r="16" fill="#ec4899" filter="url(#glow2)"/>
  <text x="680" y="185" fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">8</text>

  <!-- Left cluster edges (low betweenness) -->
  <line x1="120" y1="180" x2="200" y2="130" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="180" x2="200" y2="230" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="130" x2="300" y2="180" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="230" x2="300" y2="180" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="130" x2="200" y2="230" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="180" x2="300" y2="180" stroke="#818cf8" stroke-width="2" opacity="0.6"/>

  <!-- Bridge edge (HIGH betweenness) -->
  <line x1="300" y1="180" x2="500" y2="180" stroke="#fbbf24" stroke-width="4.5" opacity="1"/>
  <text x="400" y="170" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Betweenness = 16</text>
  <text x="400" y="210" fill="#fde68a" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">ALL cross-community paths pass here</text>

  <!-- Right cluster edges (low betweenness) -->
  <line x1="500" y1="180" x2="600" y2="130" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="180" x2="600" y2="230" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="130" x2="680" y2="180" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="230" x2="680" y2="180" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="130" x2="600" y2="230" stroke="#f472b6" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="180" x2="680" y2="180" stroke="#f472b6" stroke-width="2" opacity="0.6"/>

  <!-- Betweenness labels on edges -->
  <text x="145" y="145" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="145" y="220" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="260" y="140" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="260" y="220" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>

  <text x="555" y="145" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="555" y="220" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="650" y="142" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>
  <text x="650" y="222" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">B=3</text>

  <!-- Bottom explanation -->
  <rect x="100" y="280" width="600" height="120" fill="rgba(0,0,0,0.35)" rx="10"/>
  <text x="400" y="305" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Why the bridge has highest betweenness:</text>
  <text x="400" y="328" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• 4 nodes in left cluster × 4 nodes in right cluster = 16 cross-community pairs</text>
  <text x="400" y="348" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Every single cross-community shortest path MUST cross the bridge edge (4→5)</text>
  <text x="400" y="368" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Internal edges carry only local traffic → much lower betweenness</text>
  <text x="400" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Removing the bridge edge splits the graph into its natural communities</text>
</svg>
