<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440">
  <defs>
    <marker id="arrowHub" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrowAuth" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#A78BFA"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="440" fill="#0F1117" rx="12"/>

  <!-- Title -->
  <text x="390" y="38" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">HITS Algorithm — Hub &amp; Authority Mutual Reinforcement</text>
  <text x="390" y="58" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Hub score = Σ authority scores of out-neighbors · Authority score = Σ hub scores of in-neighbors</text>

  <!-- ============================================================ -->
  <!--  LEFT SIDE: Hub nodes  -->
  <!-- ============================================================ -->
  <!-- Hub label banner -->
  <rect x="60" y="78" width="160" height="30" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="140" y="97" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FCD34D" text-anchor="middle">HUB NODES</text>

  <!-- Hub H1 -->
  <circle cx="140" cy="175" r="44" fill="#1C1109" stroke="#F59E0B" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="140" y="170" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">H1</text>
  <text x="140" y="188" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FDE68A" text-anchor="middle">h = 0.55</text>

  <!-- Hub H2 -->
  <circle cx="140" cy="310" r="44" fill="#1C1109" stroke="#F59E0B" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="140" y="305" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">H2</text>
  <text x="140" y="323" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FDE68A" text-anchor="middle">h = 0.45</text>

  <!-- ============================================================ -->
  <!--  RIGHT SIDE: Authority nodes  -->
  <!-- ============================================================ -->
  <!-- Authority label banner -->
  <rect x="555" y="78" width="168" height="30" rx="6" fill="#2E1065" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="640" y="97" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#C4B5FD" text-anchor="middle">AUTHORITY NODES</text>

  <!-- Auth A1 -->
  <circle cx="640" cy="175" r="44" fill="#0D0A1F" stroke="#A78BFA" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="640" y="170" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">A1</text>
  <text x="640" y="188" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DDD6FE" text-anchor="middle">a = 0.60</text>

  <!-- Auth A2 -->
  <circle cx="640" cy="310" r="44" fill="#0D0A1F" stroke="#A78BFA" stroke-width="2.5" filter="url(#sh2)"/>
  <text x="640" y="305" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">A2</text>
  <text x="640" y="323" font-family="'Segoe UI', sans-serif" font-size="11" fill="#DDD6FE" text-anchor="middle">a = 0.40</text>

  <!-- ============================================================ -->
  <!--  FORWARD EDGES: Hubs → Authorities (solid amber)  -->
  <!-- ============================================================ -->
  <!-- H1 → A1 -->
  <line x1="184" y1="162" x2="596" y2="162" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arrowHub)"/>
  <!-- H1 → A2 -->
  <line x1="184" y1="190" x2="596" y2="298" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arrowHub)" stroke-dasharray="6,3"/>
  <!-- H2 → A1 -->
  <line x1="184" y1="296" x2="596" y2="188" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arrowHub)" stroke-dasharray="6,3"/>
  <!-- H2 → A2 -->
  <line x1="184" y1="322" x2="596" y2="322" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arrowHub)"/>

  <!-- Edge Labels for forward edges -->
  <rect x="352" y="148" width="76" height="20" rx="4" fill="#1C1109" stroke="#F59E0B" stroke-width="1"/>
  <text x="390" y="162" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FDE68A" text-anchor="middle">links to → boosts a</text>
  <rect x="352" y="308" width="76" height="20" rx="4" fill="#1C1109" stroke="#F59E0B" stroke-width="1"/>
  <text x="390" y="322" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FDE68A" text-anchor="middle">links to → boosts a</text>

  <!-- ============================================================ -->
  <!--  FEEDBACK LABEL at center  -->
  <!-- ============================================================ -->
  <rect x="312" y="218" width="155" height="50" rx="8" fill="#1A1D27" stroke="#6B7280" stroke-width="1.2"/>
  <text x="390" y="240" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E5E7EB" text-anchor="middle">MUTUAL REINFORCEMENT</text>
  <text x="390" y="258" font-family="'Segoe UI', sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Strong hubs → strong authorities</text>

  <!-- ============================================================ -->
  <!--  BOTTOM FORMULAS  -->
  <!-- ============================================================ -->
  <rect x="60" y="378" width="300" height="44" rx="8" fill="#1C1109" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="210" y="398" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">Hub Update</text>
  <text x="210" y="415" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FDE68A" text-anchor="middle">h(v) ← Σ a(u) for all v→u</text>

  <rect x="415" y="378" width="308" height="44" rx="8" fill="#0D0A1F" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="570" y="398" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Authority Update</text>
  <text x="570" y="415" font-family="'Segoe UI', sans-serif" font-size="12" fill="#DDD6FE" text-anchor="middle">a(v) ← Σ h(u) for all u→v</text>
</svg>
