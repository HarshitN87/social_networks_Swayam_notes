<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#1e1b4b" rx="12"/>
  <text x="350" y="28" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="16" font-weight="bold">Preferential Attachment — "Rich Get Richer"</text>

  <!-- Stage 1: Triangle -->
  <text x="120" y="65" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="12" font-weight="bold">Stage 1: Start</text>
  <circle cx="80" cy="110" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="80" y="115" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">A</text>
  <circle cx="160" cy="110" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">B</text>
  <circle cx="120" cy="170" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="120" y="175" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">C</text>
  <line x1="98" y1="110" x2="142" y2="110" stroke="#818cf8" stroke-width="2"/>
  <line x1="85" y1="127" x2="115" y2="155" stroke="#818cf8" stroke-width="2"/>
  <line x1="155" y1="127" x2="125" y2="155" stroke="#818cf8" stroke-width="2"/>
  <text x="120" y="205" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="10">All equal: degree 2</text>

  <!-- Arrow -->
  <line x1="200" y1="135" x2="240" y2="135" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="220" y="125" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="9">D joins</text>

  <!-- Stage 2: D joins, picks A & C -->
  <text x="350" y="65" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="12" font-weight="bold">Stage 2: D picks A, C</text>
  <circle cx="300" cy="110" r="20" fill="#7c3aed" stroke="#a78bfa" stroke-width="2"/>
  <text x="300" y="115" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">A</text>
  <text x="300" y="90" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="9">deg=3</text>
  <circle cx="380" cy="110" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">B</text>
  <text x="380" y="90" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">deg=2</text>
  <circle cx="340" cy="170" r="20" fill="#7c3aed" stroke="#a78bfa" stroke-width="2"/>
  <text x="340" y="175" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">C</text>
  <text x="340" y="195" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="9">deg=3</text>
  <circle cx="400" cy="170" r="16" fill="#059669" stroke="#34d399" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">D</text>
  <line x1="318" y1="110" x2="362" y2="110" stroke="#818cf8" stroke-width="2"/>
  <line x1="305" y1="127" x2="335" y2="155" stroke="#818cf8" stroke-width="2"/>
  <line x1="375" y1="127" x2="345" y2="155" stroke="#818cf8" stroke-width="2"/>
  <line x1="395" y1="156" x2="355" y2="155" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="395" y1="156" x2="315" y2="120" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="350" y="215" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="10">A and C pull ahead!</text>

  <!-- Arrow -->
  <line x1="430" y1="135" x2="470" y2="135" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="450" y="125" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="9">E joins</text>

  <!-- Stage 3: E joins, rich get richer -->
  <text x="580" y="65" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="12" font-weight="bold">Stage 3: E prefers A, C</text>
  <circle cx="530" cy="100" r="24" fill="#7c3aed" stroke="#fbbf24" stroke-width="3"/>
  <text x="530" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">A</text>
  <text x="530" y="75" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="10" font-weight="bold">deg=4★</text>
  <circle cx="620" cy="100" r="18" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">B</text>
  <text x="620" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="9">deg=2</text>
  <circle cx="560" cy="165" r="24" fill="#7c3aed" stroke="#fbbf24" stroke-width="3"/>
  <text x="560" y="170" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">C</text>
  <text x="560" y="195" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="10" font-weight="bold">deg=4★</text>
  <circle cx="640" cy="165" r="14" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
  <text x="640" y="170" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">D</text>
  <circle cx="580" cy="100" r="14" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  <text x="580" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">E</text>

  <!-- Feedback loop box -->
  <rect x="100" y="245" width="500" height="150" fill="#312e81" stroke="#4f46e5" stroke-width="2" rx="10"/>
  <text x="350" y="270" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="14" font-weight="bold">The Positive Feedback Loop</text>
  <!-- Loop -->
  <rect x="140" y="290" width="130" height="35" fill="#4f46e5" rx="6"/>
  <text x="205" y="312" text-anchor="middle" fill="white" font-family="Arial" font-size="11">More connections</text>
  <line x1="270" y1="307" x2="310" y2="307" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="315" y="290" width="130" height="35" fill="#4f46e5" rx="6"/>
  <text x="380" y="312" text-anchor="middle" fill="white" font-family="Arial" font-size="11">More visible</text>
  <line x1="445" y1="307" x2="485" y2="307" stroke="#34d399" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="490" y="290" width="80" height="35" fill="#4f46e5" rx="6"/>
  <text x="530" y="312" text-anchor="middle" fill="white" font-family="Arial" font-size="11">Attract</text>
  <!-- Bottom loop back -->
  <line x1="530" y1="325" x2="530" y2="360" stroke="#fbbf24" stroke-width="2"/>
  <line x1="530" y1="360" x2="205" y2="360" stroke="#fbbf24" stroke-width="2"/>
  <line x1="205" y1="360" x2="205" y2="330" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="370" y="378" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="11" font-weight="bold">Even more new links → Cycle repeats forever</text>
</svg>
