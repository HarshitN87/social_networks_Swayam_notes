<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)" rx="12"/>
  <text x="400" y="35" fill="#e0e0ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Girvan-Newman Algorithm — Step-by-Step Edge Removal</text>

  <!-- Step 1: Original Graph -->
  <text x="135" y="70" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Step 1: Original</text>
  <!-- Left mini-cluster -->
  <circle cx="70" cy="120" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="120" cy="100" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="95" cy="160" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <line x1="70" y1="120" x2="120" y2="100" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="70" y1="120" x2="95" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="100" x2="95" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <!-- Bridge 1 -->
  <line x1="120" y1="100" x2="165" y2="120" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  <!-- Right mini-cluster -->
  <circle cx="165" cy="120" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="205" cy="100" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="185" cy="160" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <line x1="165" y1="120" x2="205" y2="100" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="165" y1="120" x2="185" y2="160" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="205" y1="100" x2="185" y2="160" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <text x="143" y="95" fill="#fbbf24" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">HIGH</text>

  <!-- Arrow 1→2 -->
  <line x1="240" y1="130" x2="280" y2="130" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="260" y="120" fill="#fde68a" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Remove</text>

  <!-- Step 2: After first removal -->
  <text x="390" y="70" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Step 2: Remove highest</text>
  <!-- Left cluster -->
  <circle cx="320" cy="120" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="370" cy="100" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="345" cy="160" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <line x1="320" y1="120" x2="370" y2="100" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="320" y1="120" x2="345" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="370" y1="100" x2="345" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <!-- Gap (removed bridge) -->
  <line x1="370" y1="100" x2="415" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="393" y="96" fill="#ef4444" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">✕</text>
  <!-- Right cluster -->
  <circle cx="415" cy="120" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="455" cy="100" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="435" cy="160" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <line x1="415" y1="120" x2="455" y2="100" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="415" y1="120" x2="435" y2="160" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="455" y1="100" x2="435" y2="160" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>

  <!-- Arrow 2→3 -->
  <line x1="490" y1="130" x2="530" y2="130" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="510" y="120" fill="#fde68a" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Split!</text>

  <!-- Step 3: Two separate communities -->
  <text x="650" y="70" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Step 3: Communities found</text>
  <!-- Community 1 -->
  <ellipse cx="590" cy="130" rx="55" ry="55" fill="rgba(99,102,241,0.1)" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="570" cy="120" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="610" cy="100" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <circle cx="590" cy="155" r="10" fill="#6366f1" filter="url(#glow3)"/>
  <line x1="570" y1="120" x2="610" y2="100" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="570" y1="120" x2="590" y2="155" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="610" y1="100" x2="590" y2="155" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <!-- Community 2 -->
  <ellipse cx="720" cy="130" rx="55" ry="55" fill="rgba(236,72,153,0.1)" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="700" cy="120" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="740" cy="100" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <circle cx="720" cy="155" r="10" fill="#ec4899" filter="url(#glow3)"/>
  <line x1="700" y1="120" x2="740" y2="100" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="700" y1="120" x2="720" y2="155" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="740" y1="100" x2="720" y2="155" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>

  <!-- Algorithm Steps Box -->
  <rect x="50" y="210" width="700" height="270" fill="rgba(0,0,0,0.35)" rx="10"/>
  <text x="400" y="240" fill="#fbbf24" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Girvan-Newman Algorithm</text>

  <text x="80" y="275" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Step 1:</text>
  <text x="145" y="275" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Calculate edge betweenness centrality for ALL edges</text>

  <text x="80" y="305" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Step 2:</text>
  <text x="145" y="305" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Find the edge with HIGHEST betweenness → this is the bottleneck bridge</text>

  <text x="80" y="335" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Step 3:</text>
  <text x="145" y="335" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">REMOVE that edge from the graph</text>

  <text x="80" y="365" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Step 4:</text>
  <text x="145" y="365" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">RECALCULATE betweenness for all remaining edges (traffic reroutes!)</text>

  <text x="80" y="395" fill="#10b981" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Step 5:</text>
  <text x="145" y="395" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12">Repeat Steps 2–4 until graph fragments into desired communities</text>

  <text x="400" y="440" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">⚠ Recalculation after each removal is the computational bottleneck — O(m × n²) total</text>

  <text x="400" y="465" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">The output is a dendrogram (hierarchy of community splits) — choose the level that best fits your needs</text>
</svg>
