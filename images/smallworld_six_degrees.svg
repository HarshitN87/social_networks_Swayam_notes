<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="420" fill="url(#bg1)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Six Degrees of Separation — Exponential Reach</text>

  <!-- Person icon at center -->
  <circle cx="80" cy="200" r="22" fill="#6366f1" filter="url(#glow1)"/>
  <text x="80" y="205" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="bold">You</text>

  <!-- Hop 1 -->
  <line x1="102" y1="200" x2="165" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="185" cy="200" r="18" fill="#4f46e5" opacity="0.9"/>
  <text x="185" y="204" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9">Hop 1</text>
  <text x="185" y="235" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">~100</text>

  <!-- Hop 2 -->
  <line x1="203" y1="200" x2="270" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="290" cy="200" r="20" fill="#7c3aed" opacity="0.9"/>
  <text x="290" y="204" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9">Hop 2</text>
  <text x="290" y="237" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">~10,000</text>

  <!-- Hop 3 -->
  <line x1="310" y1="200" x2="375" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="400" cy="200" r="24" fill="#a855f7" opacity="0.9"/>
  <text x="400" y="204" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9">Hop 3</text>
  <text x="400" y="242" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">~1,000,000</text>

  <!-- Hop 4-6 -->
  <line x1="424" y1="200" x2="485" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="510" cy="200" r="26" fill="#c084fc" opacity="0.85"/>
  <text x="510" y="196" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9">Hop</text>
  <text x="510" y="210" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9">4-5</text>
  <text x="510" y="244" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">10⁸–10¹⁰</text>

  <!-- Hop 6 — world -->
  <line x1="536" y1="200" x2="600" y2="200" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="640" cy="200" r="35" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-width="2"/>
  <circle cx="640" cy="200" r="28" fill="#22c55e" opacity="0.15"/>
  <text x="640" y="196" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Hop 6</text>
  <text x="640" y="210" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="9">Everyone</text>
  <text x="640" y="253" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="10" font-weight="bold">>7 Billion</text>

  <!-- Formula -->
  <rect x="120" y="290" width="560" height="55" rx="8" fill="#1e1b4b" opacity="0.7" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="312" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="13">If each person knows ~100 people → Reach at hop h = 100ʰ</text>
  <text x="400" y="332" text-anchor="middle" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="12">100¹ = 100   |   100² = 10K   |   100³ = 1M   |   100⁶ > 7 Billion</text>

  <!-- Arrow labels -->
  <text x="400" y="385" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-style="italic">Exponential connectivity explains why 6 hops suffice to reach anyone on Earth</text>
</svg>
