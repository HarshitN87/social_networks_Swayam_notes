<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowK">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="850" height="550" fill="url(#bgK)" rx="12"/>
  <text x="425" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="17" font-weight="bold">K-Shell Decomposition — Peeling the Network Like an Onion</text>

  <!-- Concentric rings representing shells -->
  <!-- Outermost shell B1 -->
  <circle cx="280" cy="280" r="210" fill="#6366f1" opacity="0.06" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="105" y="120" fill="#818cf8" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Shell B₁ (k=1)</text>
  <text x="105" y="136" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Periphery — removed first</text>
  <!-- Peripheral nodes -->
  <circle cx="120" cy="200" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="100" cy="280" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="130" cy="350" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="280" cy="95" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="350" cy="100" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="440" cy="130" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="460" cy="400" r="5" fill="#6366f1" opacity="0.5"/>
  <circle cx="420" cy="450" r="5" fill="#6366f1" opacity="0.5"/>
  <line x1="120" y1="200" x2="100" y2="280" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="280" x2="130" y2="350" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>
  <line x1="280" y1="95" x2="350" y2="100" stroke="#6366f1" stroke-width="0.8" opacity="0.3"/>

  <!-- Shell B2 -->
  <circle cx="280" cy="280" r="155" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="145" y="173" fill="#c084fc" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Shell B₂ (k=2)</text>
  <circle cx="170" cy="220" r="6" fill="#a855f7" opacity="0.6"/>
  <circle cx="160" cy="300" r="6" fill="#a855f7" opacity="0.6"/>
  <circle cx="180" cy="370" r="6" fill="#a855f7" opacity="0.6"/>
  <circle cx="390" cy="160" r="6" fill="#a855f7" opacity="0.6"/>
  <circle cx="400" cy="390" r="6" fill="#a855f7" opacity="0.6"/>
  <line x1="170" y1="220" x2="160" y2="300" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="160" y1="300" x2="180" y2="370" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>

  <!-- Shell B3 (pseudo-core area) -->
  <circle cx="280" cy="280" r="100" fill="#f59e0b" opacity="0.10" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="218" fill="#fbbf24" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Pseudo-core Shells</text>
  <text x="190" y="233" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10">(k ≈ mid-range)</text>
  <circle cx="220" cy="260" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="210" cy="310" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="240" cy="340" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="340" cy="220" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="350" cy="340" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="320" cy="360" r="7" fill="#f59e0b" opacity="0.8"/>
  <line x1="220" y1="260" x2="210" y2="310" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="210" y1="310" x2="240" y2="340" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="340" y1="220" x2="350" y2="340" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="350" y1="340" x2="320" y2="360" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="220" y1="260" x2="340" y2="220" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="240" y1="340" x2="320" y2="360" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>

  <!-- Innermost core -->
  <circle cx="280" cy="280" r="45" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="2.5" filter="url(#glowK)"/>
  <text x="280" y="268" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Inner Core</text>
  <text x="280" y="282" text-anchor="middle" fill="#fca5a5" font-family="Arial,sans-serif" font-size="10">(k = max)</text>
  <circle cx="270" cy="296" r="6" fill="#ef4444"/><circle cx="290" cy="296" r="6" fill="#ef4444"/>
  <circle cx="280" cy="310" r="6" fill="#ef4444"/>
  <line x1="270" y1="296" x2="290" y2="296" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="270" y1="296" x2="280" y2="310" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="290" y1="296" x2="280" y2="310" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Right side: Algorithm steps -->
  <rect x="520" y="55" width="310" height="260" rx="8" fill="#1e1b4b" opacity="0.65" stroke="#6366f1" stroke-width="1"/>
  <text x="675" y="80" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="13" font-weight="bold">K-Shell Decomposition Algorithm</text>
  <text x="540" y="108" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Step 1:</text>
  <text x="600" y="108" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Remove all degree-1 nodes → B₁</text>
  <text x="540" y="128" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">(repeat until no degree-1 left)</text>
  <text x="540" y="155" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Step 2:</text>
  <text x="600" y="155" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Remove all degree-2 nodes → B₂</text>
  <text x="540" y="175" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">(repeat until no degree-2 left)</text>
  <text x="540" y="202" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Step 3:</text>
  <text x="600" y="202" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Remove all degree-3 nodes → B₃</text>
  <text x="540" y="230" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11" font-weight="bold">...</text>
  <text x="560" y="230" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Continue until network is empty</text>
  <text x="540" y="260" fill="#ef4444" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Last bucket</text>
  <text x="640" y="260" fill="#fca5a5" font-family="Arial,sans-serif" font-size="11">= innermost core</text>
  <text x="540" y="290" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Coreness of node = deepest shell it belongs to</text>

  <!-- Key formula box -->
  <rect x="520" y="330" width="310" height="80" rx="8" fill="#14532d" opacity="0.5" stroke="#22c55e" stroke-width="1"/>
  <text x="675" y="355" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="12" font-weight="bold">K-Core vs K-Shell (Critical!)</text>
  <text x="540" y="378" fill="#86efac" font-family="Arial,sans-serif" font-size="11">K-shell (Bucket Bₖ) = nodes removed at step k</text>
  <text x="540" y="398" fill="#4ade80" font-family="Arial,sans-serif" font-size="11" font-weight="bold">K-core = Bₖ ∪ Bₖ₊₁ ∪ ... ∪ Bₘₐₓ = ∪ⱼ≥ₖ Bⱼ</text>

  <!-- Bottom insight -->
  <rect x="50" y="440" width="750" height="90" rx="8" fill="#1e1b4b" opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
  <text x="425" y="465" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Why Coreness > Degree for Predicting Influence</text>
  <text x="425" y="488" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">A high-degree node can be peripheral (many connections but to low-degree nodes)</text>
  <text x="425" y="508" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">A high-coreness node is deeply embedded in a dense, well-connected region → true influence</text>
</svg>
