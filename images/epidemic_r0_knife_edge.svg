<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#1e1b4b" rx="12"/>
  <text x="350" y="28" text-anchor="middle" fill="#e0e7ff" font-family="Arial" font-size="16" font-weight="bold">R₀ Knife-Edge — Epidemic vs Extinction Threshold</text>

  <!-- Scale / Number line -->
  <line x1="80" y1="180" x2="620" y2="180" stroke="#4f46e5" stroke-width="3"/>

  <!-- Threshold marker at R₀ = 1 -->
  <line x1="350" y1="130" x2="350" y2="230" stroke="#fbbf24" stroke-width="3"/>
  <text x="350" y="120" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="18" font-weight="bold">R₀ = 1</text>
  <text x="350" y="250" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="12">CRITICAL THRESHOLD</text>

  <!-- LEFT: Subcritical (extinction) -->
  <rect x="50" y="50" width="270" height="100" fill="#064e3b" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="185" y="75" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="14" font-weight="bold">R₀ &lt; 1 → EXTINCTION</text>
  <text x="185" y="95" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="11">Each person infects &lt; 1 other</text>
  <text x="185" y="113" text-anchor="middle" fill="#a7f3d0" font-family="Arial" font-size="11">Disease CERTAINLY dies out</text>
  <text x="185" y="131" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="11" font-weight="bold">Probability of extinction = 1</text>

  <!-- Tick marks on the left -->
  <line x1="130" y1="175" x2="130" y2="185" stroke="#34d399" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="10">0.5</text>
  <line x1="220" y1="175" x2="220" y2="185" stroke="#34d399" stroke-width="2"/>
  <text x="220" y="200" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="10">0.8</text>
  <line x1="300" y1="175" x2="300" y2="185" stroke="#34d399" stroke-width="2"/>
  <text x="300" y="200" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="10">0.9</text>

  <!-- RIGHT: Supercritical (epidemic) -->
  <rect x="380" y="50" width="270" height="100" fill="#7f1d1d" stroke="#f87171" stroke-width="2" rx="8"/>
  <text x="515" y="75" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="14" font-weight="bold">R₀ &gt; 1 → EPIDEMIC</text>
  <text x="515" y="95" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="11">Each person infects &gt; 1 other</text>
  <text x="515" y="113" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="11">Disease CAN persist (not certain!)</text>
  <text x="515" y="131" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="11" font-weight="bold">Positive probability of survival</text>

  <!-- Tick marks on the right -->
  <line x1="400" y1="175" x2="400" y2="185" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">1.1</text>
  <line x1="460" y1="175" x2="460" y2="185" stroke="#f87171" stroke-width="2"/>
  <text x="460" y="200" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">1.5</text>
  <line x1="540" y1="175" x2="540" y2="185" stroke="#f87171" stroke-width="2"/>
  <text x="540" y="200" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">3.0</text>
  <line x1="600" y1="175" x2="600" y2="185" stroke="#f87171" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">10.8</text>

  <!-- Public Health Strategies Box -->
  <rect x="80" y="275" width="250" height="90" fill="#312e81" stroke="#818cf8" stroke-width="1.5" rx="8"/>
  <text x="205" y="296" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="12" font-weight="bold">Reduce p (biology)</text>
  <text x="205" y="313" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• Masks, hygiene</text>
  <text x="205" y="328" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• Vaccines</text>
  <text x="205" y="343" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• Antiviral treatment</text>

  <rect x="370" y="275" width="250" height="90" fill="#312e81" stroke="#818cf8" stroke-width="1.5" rx="8"/>
  <text x="495" y="296" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="12" font-weight="bold">Reduce k (network)</text>
  <text x="495" y="313" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• Social distancing</text>
  <text x="495" y="328" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• Quarantine</text>
  <text x="495" y="343" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">• School/workplace closure</text>

  <text x="350" y="270" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="12" font-weight="bold">R₀ = p × k → Push below 1 by reducing either variable</text>
</svg>
