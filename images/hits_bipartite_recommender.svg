<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5B9BD5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#70AD47"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="480" fill="#0F1117" rx="12"/>

  <!-- Title -->
  <text x="390" y="38" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bipartite Recommender System</text>

  <!-- Subtitle -->
  <text x="390" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Recommenders (left) score = Σ endorsed resource scores · Resources (right) score = Σ pointing recommender scores</text>

  <!-- Column Headers -->
  <text x="175" y="95" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#5B9BD5" text-anchor="middle">RECOMMENDERS</text>
  <text x="590" y="95" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#70AD47" text-anchor="middle">RESOURCES</text>

  <!-- === RECOMMENDER NODES (left column) === -->
  <!-- R1 -->
  <circle cx="175" cy="160" r="36" fill="#1E3A5F" stroke="#5B9BD5" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="175" y="155" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#5B9BD5" text-anchor="middle">R1</text>
  <text x="175" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">score: 1→0.38</text>

  <!-- R2 -->
  <circle cx="175" cy="280" r="36" fill="#1E3A5F" stroke="#5B9BD5" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="175" y="275" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#5B9BD5" text-anchor="middle">R2</text>
  <text x="175" y="292" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">score: 1→0.28</text>

  <!-- R3 -->
  <circle cx="175" cy="400" r="36" fill="#1E3A5F" stroke="#5B9BD5" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="175" y="395" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#5B9BD5" text-anchor="middle">R3</text>
  <text x="175" y="412" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD" text-anchor="middle">score: 1→0.34</text>

  <!-- === RESOURCE NODES (right column) === -->
  <!-- S1 -->
  <circle cx="590" cy="130" r="36" fill="#1A3A1F" stroke="#70AD47" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="590" y="125" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#70AD47" text-anchor="middle">S1</text>
  <text x="590" y="142" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86EFAC" text-anchor="middle">score: 1→0.30</text>

  <!-- S2 -->
  <circle cx="590" cy="220" r="36" fill="#1A3A1F" stroke="#70AD47" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="590" y="215" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#70AD47" text-anchor="middle">S2</text>
  <text x="590" y="232" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86EFAC" text-anchor="middle">score: 1→0.18</text>

  <!-- S3 -->
  <circle cx="590" cy="310" r="36" fill="#1A3A1F" stroke="#70AD47" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="590" y="305" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#70AD47" text-anchor="middle">S3</text>
  <text x="590" y="322" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86EFAC" text-anchor="middle">score: 1→0.22</text>

  <!-- S4 -->
  <circle cx="590" cy="390" r="36" fill="#1A3A1F" stroke="#70AD47" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="590" y="385" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#70AD47" text-anchor="middle">S4</text>
  <text x="590" y="402" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86EFAC" text-anchor="middle">score: 1→0.16</text>

  <!-- S5 -->
  <circle cx="590" cy="450" r="30" fill="#1A3A1F" stroke="#70AD47" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="446" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#70AD47" text-anchor="middle">S5</text>
  <text x="590" y="461" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86EFAC" text-anchor="middle">score: 1→0.14</text>

  <!-- === EDGES R1 → S1, S2 === -->
  <line x1="211" y1="148" x2="554" y2="128" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>
  <line x1="211" y1="165" x2="554" y2="213" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>

  <!-- === EDGES R2 → S2, S3, S4 === -->
  <line x1="211" y1="270" x2="554" y2="220" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>
  <line x1="211" y1="280" x2="554" y2="308" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>
  <line x1="211" y1="292" x2="554" y2="380" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>

  <!-- === EDGES R3 → S1, S5 === -->
  <line x1="208" y1="388" x2="554" y2="142" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>
  <line x1="210" y1="412" x2="560" y2="436" stroke="#5B9BD5" stroke-width="1.8" stroke-opacity="0.9" marker-end="url(#arrowBlue)"/>

  <!-- Legend Box -->
  <rect x="270" y="195" width="240" height="90" rx="8" fill="#1C1F2A" stroke="#374151" stroke-width="1.2"/>
  <text x="390" y="215" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="middle">Scoring &amp; Normalization</text>
  <text x="285" y="235" font-family="'Segoe UI', sans-serif" font-size="11" fill="#93C5FD">score(R) = Σ scores of resources endorsed</text>
  <text x="285" y="252" font-family="'Segoe UI', sans-serif" font-size="11" fill="#86EFAC">score(S) = Σ scores of recommenders → S</text>
  <text x="285" y="270" font-family="'Segoe UI', sans-serif" font-size="11" fill="#D1D5DB">Normalize: divide by group total → repeat</text>
</svg>
