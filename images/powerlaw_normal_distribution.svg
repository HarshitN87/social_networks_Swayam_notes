<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="#1e1b4b" rx="12"/>
  <text x="300" y="30" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="16" font-weight="bold">Normal Distribution — Bell Curve of Heights</text>
  <!-- Axes -->
  <line x1="80" y1="280" x2="550" y2="280" stroke="#818cf8" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="50" stroke="#818cf8" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="315" y="310" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="12">Height (cm)</text>
  <text x="30" y="165" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="12" transform="rotate(-90, 30, 165)">% of Population</text>
  <!-- Bell curve fill -->
  <path d="M 90,278 Q 120,275 150,265 Q 180,240 210,200 Q 240,140 270,90 Q 300,60 315,55 Q 330,60 345,90 Q 375,140 405,200 Q 435,240 465,265 Q 495,275 525,278 Z" fill="url(#bellGrad)"/>
  <!-- Bell curve line -->
  <path d="M 90,278 Q 120,275 150,265 Q 180,240 210,200 Q 240,140 270,90 Q 300,60 315,55 Q 330,60 345,90 Q 375,140 405,200 Q 435,240 465,265 Q 495,275 525,278" fill="none" stroke="#818cf8" stroke-width="3"/>
  <!-- Peak line -->
  <line x1="315" y1="55" x2="315" y2="280" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="315" y="295" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="11">170 cm (avg)</text>
  <!-- Annotations -->
  <text x="130" y="260" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">Very short</text>
  <text x="130" y="272" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">(rare)</text>
  <text x="500" y="260" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">Very tall</text>
  <text x="500" y="272" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="10">(rare)</text>
  <text x="315" y="45" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="11" font-weight="bold">Peak = Most people are average</text>
  <!-- Tick marks -->
  <text x="130" y="295" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">150</text>
  <text x="230" y="295" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">160</text>
  <text x="400" y="295" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">180</text>
  <text x="500" y="295" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="10">190</text>
  <!-- Arrows showing thin tails -->
  <path d="M 100,250 L 100,275" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <path d="M 520,250 L 520,275" stroke="#f87171" stroke-width="1.5"/>
  <!-- Legend -->
  <rect x="400" y="70" width="170" height="55" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" rx="6" opacity="0.9"/>
  <text x="410" y="88" fill="#c7d2fe" font-family="Arial" font-size="10">• Symmetrical shape</text>
  <text x="410" y="103" fill="#c7d2fe" font-family="Arial" font-size="10">• Most data near the mean</text>
  <text x="410" y="118" fill="#c7d2fe" font-family="Arial" font-size="10">• Extreme outliers are rare</text>
</svg>
