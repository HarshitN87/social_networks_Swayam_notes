<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="700" height="380" fill="url(#bg5)" rx="12"/>
  <text x="350" y="30" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Linear Threshold Model — Step-by-Step Cascade</text>
  
  <!-- Step 1 -->
  <text x="120" y="65" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">t = 0 (Seed)</text>
  <circle cx="80" cy="110" r="12" fill="#2ecc71"/><text x="80" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="120" cy="90" r="12" fill="#555"/><text x="120" y="94" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <circle cx="160" cy="110" r="12" fill="#555"/><text x="160" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <circle cx="100" cy="145" r="12" fill="#555"/><text x="100" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <circle cx="140" cy="145" r="12" fill="#555"/><text x="140" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <line x1="80" y1="110" x2="120" y2="90" stroke="#666" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="160" y2="110" stroke="#666" stroke-width="1.5"/>
  <line x1="80" y1="110" x2="100" y2="145" stroke="#666" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="140" y2="145" stroke="#666" stroke-width="1.5"/>
  <line x1="100" y1="145" x2="140" y2="145" stroke="#666" stroke-width="1.5"/>
  <line x1="160" y1="110" x2="140" y2="145" stroke="#666" stroke-width="1.5"/>
  
  <!-- Arrow -->
  <text x="215" y="115" fill="#53d8fb" font-family="Arial,sans-serif" font-size="18">→</text>
  
  <!-- Step 2 -->
  <text x="330" y="65" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">t = 1 (Spread)</text>
  <circle cx="290" cy="110" r="12" fill="#2ecc71"/><text x="290" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="330" cy="90" r="12" fill="#2ecc71"/><text x="330" y="94" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="370" cy="110" r="12" fill="#555"/><text x="370" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <circle cx="310" cy="145" r="12" fill="#2ecc71"/><text x="310" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="350" cy="145" r="12" fill="#555"/><text x="350" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">A</text>
  <line x1="290" y1="110" x2="330" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="330" y1="90" x2="370" y2="110" stroke="#666" stroke-width="1.5"/>
  <line x1="290" y1="110" x2="310" y2="145" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="330" y1="90" x2="350" y2="145" stroke="#666" stroke-width="1.5"/>
  <line x1="310" y1="145" x2="350" y2="145" stroke="#666" stroke-width="1.5"/>
  <line x1="370" y1="110" x2="350" y2="145" stroke="#666" stroke-width="1.5"/>
  
  <!-- Arrow -->
  <text x="425" y="115" fill="#53d8fb" font-family="Arial,sans-serif" font-size="18">→</text>
  
  <!-- Step 3 -->
  <text x="545" y="65" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12" font-weight="bold">t = 2 (Full)</text>
  <circle cx="505" cy="110" r="12" fill="#2ecc71"/><text x="505" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="545" cy="90" r="12" fill="#2ecc71"/><text x="545" y="94" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="585" cy="110" r="12" fill="#2ecc71"/><text x="585" y="114" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="525" cy="145" r="12" fill="#2ecc71"/><text x="525" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <circle cx="565" cy="145" r="12" fill="#2ecc71"/><text x="565" y="149" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9">B</text>
  <line x1="505" y1="110" x2="545" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="545" y1="90" x2="585" y2="110" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="505" y1="110" x2="525" y2="145" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="545" y1="90" x2="565" y2="145" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="525" y1="145" x2="565" y2="145" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="585" y1="110" x2="565" y2="145" stroke="#2ecc71" stroke-width="1.5"/>
  
  <!-- Threshold explanation -->
  <rect x="40" y="185" width="620" height="70" fill="rgba(255,255,255,0.04)" rx="8"/>
  <text x="350" y="210" text-anchor="middle" fill="#53d8fb" font-family="Arial,sans-serif" font-size="13" font-weight="bold">How Threshold q Works (Example: q = 0.40)</text>
  <text x="350" y="232" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">Node with 5 neighbours: needs ⌈0.40 × 5⌉ = 2 neighbours on B to switch</text>
  <text x="350" y="248" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="12">Node with 3 neighbours: needs ⌈0.40 × 3⌉ = 2 neighbours on B to switch</text>
  
  <!-- Three outcomes -->
  <rect x="40" y="275" width="195" height="90" fill="rgba(46,204,113,0.08)" rx="8"/>
  <text x="137" y="298" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Full Cascade</text>
  <text x="137" y="315" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">Everyone switches to B</text>
  <text x="137" y="330" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">Low q, well-connected</text>
  <text x="137" y="350" text-anchor="middle" fill="#2ecc71" font-family="Arial,sans-serif" font-size="10">seed network</text>
  
  <rect x="252" y="275" width="195" height="90" fill="rgba(255,204,0,0.08)" rx="8"/>
  <text x="350" y="298" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Partial Cascade</text>
  <text x="350" y="315" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="10">B wins some clusters</text>
  <text x="350" y="330" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">Dense clusters block</text>
  <text x="350" y="350" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="10">spread at boundaries</text>
  
  <rect x="465" y="275" width="195" height="90" fill="rgba(233,69,96,0.08)" rx="8"/>
  <text x="562" y="298" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="12" font-weight="bold">No Cascade</text>
  <text x="562" y="315" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10">B dies out completely</text>
  <text x="562" y="330" text-anchor="middle" fill="#aaa" font-family="Arial,sans-serif" font-size="10">High q, small seed,</text>
  <text x="562" y="350" text-anchor="middle" fill="#e94560" font-family="Arial,sans-serif" font-size="10">no bridges available</text>
</svg>
